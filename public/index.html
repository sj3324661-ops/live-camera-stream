<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 { margin: 20px 0; }

    button {
      padding: 13px 18px;
      margin: 6px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    video {
      width: 92%;
      max-width: 600px;
      background: black;
      border-radius: 12px;
      margin-top: 15px;
    }

    #qrcode {
      background: white;
      padding: 15px;
      width: 220px;
      margin: 20px auto;
    }

    #scanner {
      width: 95%;
      max-width: 500px;
      margin: 20px auto;
    }

    .box {
      margin: 15px;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 15px;
    }

    #status {
      margin: 15px;
      color: #00ff88;
    }
  </style>
</head>

<body>

<h1>📷 Live Camera</h1>

<div class="box">

  <h2>Camera Phone</h2>

  <button onclick="startCamera()">📷 Start Camera</button>

  <button onclick="switchCamera()">🔄 Front / Back</button>

  <button onclick="stopCamera()">⛔ Stop</button>

  <p id="cameraStatus">Camera बंद है</p>

  <video id="localVideo" autoplay playsinline muted></video>

  <div id="qrcode"></div>

  <p id="roomText"></p>

</div>

<div class="box">

  <h2>Viewer Phone</h2>

  <button onclick="startScanner()">📱 Scan QR</button>

  <div id="scanner"></div>

  <p id="viewerStatus">
    QR scan करके camera से connect करें
  </p>

  <video id="remoteVideo" autoplay playsinline controls></video>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let localStream = null;
let peerConnection = null;
let roomId = null;

let currentFacingMode = "environment";

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const configuration = {

  iceServers: [

    {
      urls: "stun:stun.l.google.com:19302"
    }

  ]

};


function createRoom() {

  roomId =
    Math.random()
    .toString(36)
    .substring(2, 10);

  const joinUrl =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    roomId;

  document.getElementById("qrcode").innerHTML = "";

  new QRCode(
    document.getElementById("qrcode"),
    {
      text: joinUrl,
      width: 220,
      height: 220
    }
  );

  document.getElementById("roomText").innerText =
    "इस QR को दूसरे फोन से Scan करें";

}


async function startCamera() {

  try {

    if (localStream) {

      localStream
        .getTracks()
        .forEach(track => track.stop());

    }

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: currentFacingMode
          }
        },

        audio: true

      });

    localVideo.srcObject =
      localStream;

    createRoom();

    socket.emit(
      "join-room",
      roomId
    );

    document.getElementById(
      "cameraStatus"
    ).innerText =
      "🟢 Camera चालू है — QR Scan करवाएँ";

  }

  catch(error) {

    console.log(error);

    document.getElementById(
      "cameraStatus"
    ).innerText =
      "❌ Camera permission नहीं मिली";

  }

}


async function switchCamera() {

  if (!localStream) {

    alert("पहले Start Camera दबाएँ");

    return;

  }

  currentFacingMode =
    currentFacingMode === "environment"
      ? "user"
      : "environment";

  await startCamera();

}


function stopCamera() {

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => track.stop());

    localStream = null;

  }

  localVideo.srcObject = null;

  if (peerConnection) {

    peerConnection.close();

    peerConnection = null;

  }

  document.getElementById(
    "cameraStatus"
  ).innerText =
    "Camera बंद है";

}


function createPeerConnection() {

  peerConnection =
    new RTCPeerConnection(
      configuration
    );

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }

  peerConnection.onicecandidate =
    event => {

      if (
        event.candidate &&
        roomId
      ) {

        socket.emit(
          "ice-candidate",
          {
            roomId: roomId,
            candidate: event.candidate
          }
        );

      }

    };


  peerConnection.ontrack =
    event => {

      remoteVideo.srcObject =
        event.streams[0];

    };

}


socket.on(
  "peer-joined",
  async () => {

    if (!localStream) return;

    createPeerConnection();

    const offer =
      await peerConnection.createOffer();

    await peerConnection.setLocalDescription(
      offer
    );

    socket.emit(
      "offer",
      {
        roomId: roomId,
        offer: offer
      }
    );

  }
);


socket.on(
  "offer",
  async offer => {

    if (!peerConnection) {

      createPeerConnection();

    }

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(offer)
    );

    const answer =
      await peerConnection.createAnswer();

    await peerConnection.setLocalDescription(
      answer
    );

    socket.emit(
      "answer",
      {
        roomId: roomId,
        answer: answer
      }
    );

    document.getElementById(
      "viewerStatus"
    ).innerText =
      "🟢 Camera से connect हो रहा है...";

  }
);


socket.on(
  "answer",
  async answer => {

    if (!peerConnection) return;

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(answer)
    );

    document.getElementById(
      "cameraStatus"
    ).innerText =
      "🟢 Viewer connected";

  }
);


socket.on(
  "ice-candidate",
  async candidate => {

    try {

      if (!peerConnection) {

        createPeerConnection();

      }

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );

    }

    catch(error) {

      console.log(
        "ICE error:",
        error
      );

    }

  }
);


function startScanner() {

  const scanner =
    new Html5Qrcode(
      "scanner"
    );

  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps: 10,
      qrbox: 250
    },

    async decodedText => {

      try {

        const url =
          new URL(decodedText);

        const scannedRoom =
          url.searchParams.get(
            "room"
          );

        if (!scannedRoom) {

          alert("गलत QR Code");

          return;

        }

        roomId =
          scannedRoom;

        document.getElementById(
          "viewerStatus"
        ).innerText =
          "🔗 Camera से connect हो रहा है...";

        socket.emit(
          "join-room",
          roomId
        );

        await scanner.stop();

      }

      catch(error) {

        console.log(error);

        document.getElementById(
          "viewerStatus"
        ).innerText =
          "❌ QR Code सही नहीं है";

      }

    },

    errorMessage => {}

  ).catch(error => {

    console.log(error);

    document.getElementById(
      "viewerStatus"
    ).innerText =
      "❌ Scanner camera शुरू नहीं हुआ";

  });

}


const urlParams =
  new URLSearchParams(
    window.location.search
  );

const autoRoom =
  urlParams.get("room");


if (autoRoom) {

  roomId =
    autoRoom;

  document.getElementById(
    "viewerStatus"
  ).innerText =
    "🔗 Room मिला — Camera से connect हो रहा है...";

  socket.emit(
    "join-room",
    roomId
  );

}

</script>

</body>
  </html>
