<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Camera</title>

<script src="/socket.io/socket.io.js"></script>

<!-- QR Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- QR Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
  text-align:center;
}

header{
  padding:18px;
  background:#0d1b2a;
  border-bottom:1px solid #26384d;
}

h1{
  margin:0;
  font-size:24px;
}

.status{
  margin:15px auto;
  width:92%;
  max-width:500px;
  padding:14px;
  border-radius:12px;
  background:#102338;
  color:#8ee6ff;
}

.container{
  width:94%;
  max-width:600px;
  margin:auto;
  padding:15px;
}

.video-box{
  position:relative;
  width:100%;
  background:#000;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:15px;
}

video{
  width:100%;
  display:block;
  background:#000;
  min-height:250px;
  object-fit:cover;
}

.label{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(0,0,0,.65);
  padding:6px 10px;
  border-radius:8px;
  font-size:13px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  border:0;
  padding:14px 10px;
  border-radius:12px;
  background:#1261ff;
  color:white;
  font-size:15px;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

.red{
  background:#e53935;
}

.green{
  background:#0ca678;
}

.gray{
  background:#34495e;
}

.hidden{
  display:none !important;
}

.panel{
  margin-top:18px;
  padding:18px;
  background:#0d1b2a;
  border-radius:16px;
}

#qrcode{
  width:220px;
  min-height:220px;
  margin:15px auto;
  padding:8px;
  background:white;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#qrcode img{
  max-width:220px;
  max-height:220px;
}

.room{
  font-size:22px;
  font-weight:bold;
  letter-spacing:4px;
  color:#00e5ff;
  margin:10px;
}

#reader{
  width:100%;
  max-width:400px;
  margin:15px auto;
}

.info{
  font-size:13px;
  color:#aebdca;
  line-height:1.6;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #34506a;
  background:#081522;
  color:white;
  border-radius:10px;
  font-size:17px;
  text-align:center;
  margin-bottom:10px;
  text-transform:uppercase;
}
</style>
</head>

<body>

<header>
  <h1>📹 Live Camera</h1>
</header>

<div id="status" class="status">
  📡 Connecting...
</div>

<div class="container">

  <!-- LOCAL CAMERA -->
  <div class="video-box">
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="label">📷 Your Camera</div>
  </div>

  <!-- REMOTE CAMERA -->
  <div class="video-box">
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="label">📡 Remote Camera</div>
  </div>

  <div class="buttons">

    <button onclick="createRoom()">
      🚀 Camera Start + QR
    </button>

    <button onclick="openQRScanner()" class="green">
      📷 Scan QR
    </button>

    <button onclick="toggleCamera()" class="gray">
      📷 Camera
    </button>

    <button onclick="toggleMic()" class="gray">
      🎤 Mic
    </button>

    <button onclick="switchCamera()" class="gray">
      🔄 Switch
    </button>

    <button onclick="stopCamera()" class="red">
      ⛔ Stop
    </button>

  </div>

  <!-- QR PANEL -->
  <div id="qrPanel" class="panel hidden">

    <h2>📱 Connect दूसरा फोन</h2>

    <div id="qrcode"></div>

    <div class="info">
      दूसरे फोन से इस QR को Scan करें
    </div>

    <div id="roomText" class="room">
      ------
    </div>

    <div class="info">
      QR काम न करे तो Room Code से भी Join कर सकते हैं।
    </div>

    <button onclick="closeQR()" class="gray">
      ✖ Close
    </button>

  </div>

  <!-- SCANNER PANEL -->
  <div id="scannerPanel" class="panel hidden">

    <h2>📷 Scan QR</h2>

    <div id="reader"></div>

    <hr>

    <p class="info">
      QR Scan न हो तो Room Code डालें
    </p>

    <input
      id="manualRoom"
      type="text"
      maxlength="6"
      placeholder="ROOM CODE"
    >

    <button onclick="joinManualRoom()" class="green">
      🔗 Join Room
    </button>

    <button onclick="closeScanner()" class="gray">
      ✖ Close
    </button>

  </div>

</div>

<script>

const socket = io();

let localStream = null;
let peerConnection = null;

let roomId = null;
let initiator = false;

let currentFacingMode = "user";
let cameraEnabled = true;
let micEnabled = true;

let html5QrCode = null;

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const statusBox =
  document.getElementById("status");

const qrPanel =
  document.getElementById("qrPanel");

const scannerPanel =
  document.getElementById("scannerPanel");


/* =========================
   STATUS
========================= */

function setStatus(text){
  statusBox.innerHTML = text;
}


/* =========================
   SOCKET CONNECT
========================= */

socket.on("connect", () => {

  console.log("Socket connected:", socket.id);

  setStatus("🟢 Server Connected");

});


socket.on("disconnect", () => {

  setStatus("🔴 Server Disconnected");

});


/* =========================
   CAMERA
========================= */

async function startCamera(){

  try{

    if(localStream){

      localStream.getTracks().forEach(
        track => track.stop()
      );

    }

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode: currentFacingMode
        },

        audio:true

      });

    localVideo.srcObject =
      localStream;

    cameraEnabled = true;
    micEnabled = true;

    console.log("Camera started");

    return true;

  }catch(error){

    console.error(error);

    setStatus(
      "❌ Camera/Mic Permission जरूरी है"
    );

    alert(
      "Camera और Microphone की permission Allow करें।"
    );

    return false;

  }

}


/* =========================
   CREATE ROOM
========================= */

async function createRoom(){

  const started =
    await startCamera();

  if(!started) return;

  roomId =
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

  initiator = true;

  console.log(
    "Creating Room:",
    roomId
  );

  socket.emit(
    "join-room",
    roomId
  );

  setStatus(
    "🟢 Ready • Room: " + roomId
  );

  showQR();

}


/* =========================
   SHOW QR
========================= */

function showQR(){

  qrPanel.classList.remove("hidden");

  const qr =
    document.getElementById("qrcode");

  qr.innerHTML = "";

  const url =
    window.location.origin +
    "/?room=" +
    encodeURIComponent(roomId);

  console.log(
    "QR URL:",
    url
  );

  /*
    पहले QRCode library से QR बनाने की कोशिश
  */

  if(
    typeof QRCode !== "undefined"
  ){

    try{

      new QRCode(qr,{

        text:url,

        width:220,

        height:220,

        correctLevel:
          QRCode.CorrectLevel.H

      });

    }catch(error){

      console.error(
        "QRCode error:",
        error
      );

      createQRFallback(
        qr,
        url
      );

    }

  }else{

    /*
      अगर QR library load नहीं हुई
      तो fallback image
    */

    createQRFallback(
      qr,
      url
    );

  }

  document.getElementById(
    "roomText"
  ).innerText =
    roomId;

}


/* =========================
   QR FALLBACK
========================= */

function createQRFallback(
  container,
  url
){

  const img =
    document.createElement("img");

  img.width = 220;
  img.height = 220;

  img.alt =
    "QR Code";

  img.src =
    "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
    encodeURIComponent(url);

  img.onerror = function(){

    container.innerHTML =
      "<div style='color:#222;padding:20px'>" +
      "QR Code load नहीं हुआ।<br><br>" +
      "Room Code नीचे दिया गया है।" +
      "</div>";

  };

  container.appendChild(img);

}


/* =========================
   CLOSE QR
========================= */

function closeQR(){

  qrPanel.classList.add(
    "hidden"
  );

}


/* =========================
   OPEN SCANNER
========================= */

function openQRScanner(){

  scannerPanel.classList.remove(
    "hidden"
  );

  startQRScanner();

}


/* =========================
   QR SCANNER
========================= */

async function startQRScanner(){

  try{

    if(html5QrCode){

      try{

        await html5QrCode.stop();

      }catch(e){}

    }

    html5QrCode =
      new Html5Qrcode("reader");

    await html5QrCode.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        }

      },

      qrCodeMessage => {

        console.log(
          "QR:",
          qrCodeMessage
        );

        stopQRScanner();

        processQR(
          qrCodeMessage
        );

      },

      errorMessage => {

        // Scan errors ignore

      }

    );

  }catch(error){

    console.error(
      "Scanner error:",
      error
    );

    alert(
      "QR Scanner शुरू नहीं हुआ। Camera permission Allow करें।"
    );

  }

}


/* =========================
   PROCESS QR
========================= */

function processQR(text){

  try{

    const url =
      new URL(text);

    const room =
      url.searchParams.get(
        "room"
      );

    if(room){

      joinRoom(room);

      return;

    }

  }catch(e){

    // Raw room code हो सकता है
  }

  const clean =
    String(text)
      .trim()
      .toUpperCase();

  if(
    /^[A-Z0-9]{6}$/.test(clean)
  ){

    joinRoom(clean);

  }else{

    alert(
      "QR Code में सही Room Code नहीं मिला।"
    );

  }

}


/* =========================
   MANUAL JOIN
========================= */

function joinManualRoom(){

  const input =
    document.getElementById(
      "manualRoom"
    );

  const room =
    input.value
      .trim()
      .toUpperCase();

  if(
    !/^[A-Z0-9]{6}$/.test(room)
  ){

    alert(
      "6 अक्षर का सही Room Code डालें।"
    );

    return;

  }

  closeScanner();

  joinRoom(room);

}


/* =========================
   JOIN ROOM
========================= */

async function joinRoom(room){

  roomId =
    String(room)
      .trim()
      .toUpperCase();

  if(!roomId) return;

  const started =
    await startCamera();

  if(!started) return;

  initiator = false;

  console.log(
    "Joining:",
    roomId
  );

  setStatus(
    "🔗 Room में Join हो रहा है..."
  );

  socket.emit(
    "join-room",
    roomId
  );

}


/* =========================
   CLOSE SCANNER
========================= */

async function closeScanner(){

  await stopQRScanner();

  scannerPanel.classList.add(
    "hidden"
  );

}


/* =========================
   STOP QR SCANNER
========================= */

async function stopQRScanner(){

  if(!html5QrCode) return;

  try{

    await html5QrCode.stop();

  }catch(e){}

  try{

    await html5QrCode.clear();

  }catch(e){}

  html5QrCode = null;

}


/* =========================
   SOCKET ROOM EVENTS
========================= */

socket.on(
  "room-joined",
  data => {

    console.log(
      "Room joined:",
      data
    );

    setStatus(
      "🟢 Room: " +
      data.roomId +
      " • Users: " +
      data.users
    );

  }
);


socket.on(
  "waiting-for-peer",
  () => {

    setStatus(
      "📡 दूसरे फोन के connect होने का इंतजार करें"
    );

  }
);


socket.on(
  "peer-joined",
  async () => {

    console.log(
      "Peer joined"
    );

    setStatus(
      "🟡 दूसरा फोन जुड़ गया • Connecting..."
    );

    if(initiator){

      await createOffer();

    }

  }
);


socket.on(
  "joined-peer",
  () => {

    console.log(
      "Joined as second phone"
    );

    setStatus(
      "🟡 Connected • Offer का इंतजार..."
    );

  }
);


socket.on(
  "room-full",
  () => {

    setStatus(
      "❌ Room Full"
    );

    alert(
      "यह Room पहले से 2 phones से connected है।"
    );

  }
);


/* =========================
   WEBRTC
========================= */

function createPeerConnection(){

  if(peerConnection){

    return peerConnection;

  }

  peerConnection =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
          "stun:stun.l.google.com:19302"
        },

        {
          urls:
          "stun:stun1.l.google.com:19302"
        }

      ]

    });


  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }


  peerConnection.ontrack =
    event => {

      console.log(
        "REMOTE TRACK",
        event
      );

      if(
        event.streams &&
        event.streams[0]
      ){

        remoteVideo.srcObject =
          event.streams[0];

        remoteVideo.muted =
          false;

        remoteVideo.play()
          .catch(error => {

            console.log(
              "Remote autoplay:",
              error
            );

          });

        setStatus(
          "🟢 LIVE • दूसरा Camera Connected"
        );

      }

    };


  peerConnection.onicecandidate =
    event => {

      if(
        event.candidate &&
        roomId
      ){

        socket.emit(
          "ice-candidate",
          {

            roomId:
              roomId,

            candidate:
              event.candidate

          }
        );

      }

    };


  peerConnection.onconnectionstatechange =
    () => {

      console.log(
        "Connection:",
        peerConnection
          .connectionState
      );

      if(
        peerConnection.connectionState ===
        "connected"
      ){

        setStatus(
          "🟢 LIVE • Connection सफल"
        );

      }

      if(
        peerConnection.connectionState ===
        "failed"
      ){

        setStatus(
          "🔴 Connection Failed"
        );

      }

    };


  return peerConnection;

}


/* =========================
   CREATE OFFER
========================= */

async function createOffer(){

  try{

    const pc =
      createPeerConnection();

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    socket.emit(
      "offer",
      {

        roomId:
          roomId,

        offer:
          pc.localDescription

      }
    );

    console.log(
      "OFFER SENT"
    );

  }catch(error){

    console.error(
      "Offer error:",
      error
    );

  }

}


/* =========================
   RECEIVE OFFER
========================= */

socket.on(
  "offer",
  async data => {

    try{

      console.log(
        "OFFER RECEIVED"
      );

      const pc =
        createPeerConnection();

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          data.offer
        )
      );

      const answer =
        await pc.createAnswer();

      await pc.setLocalDescription(
        answer
      );

      socket.emit(
        "answer",
        {

          roomId:
            roomId,

          answer:
            pc.localDescription

        }
      );

      setStatus(
        "🟡 Connecting..."
      );

    }catch(error){

      console.error(
        "Offer receive error:",
        error
      );

    }

  }
);


/* =========================
   RECEIVE ANSWER
========================= */

socket.on(
  "answer",
  async data => {

    try{

      console.log(
        "ANSWER RECEIVED"
      );

      if(!peerConnection){

        return;

      }

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(
          data.answer
        )
      );

      setStatus(
        "🟢 Answer received • Connecting..."
      );

    }catch(error){

      console.error(
        "Answer error:",
        error
      );

    }

  }
);


/* =========================
   ICE CANDIDATE
========================= */

socket.on(
  "ice-candidate",
  async data => {

    try{

      if(
        peerConnection &&
        data.candidate
      ){

        await peerConnection.addIceCandidate(
          new RTCIceCandidate(
            data.candidate
          )
        );

      }

    }catch(error){

      console.error(
        "ICE error:",
        error
      );

    }

  }
);


/* =========================
   CAMERA ON/OFF
========================= */

function toggleCamera(){

  if(!localStream) return;

  const track =
    localStream.getVideoTracks()[0];

  if(!track) return;

  cameraEnabled =
    !cameraEnabled;

  track.enabled =
    cameraEnabled;

  setStatus(
    cameraEnabled
      ? "📷 Camera ON"
      : "📷 Camera OFF"
  );

}


/* =========================
   MIC ON/OFF
========================= */

function toggleMic(){

  if(!localStream) return;

  const track =
    localStream.getAudioTracks()[0];

  if(!track) return;

  micEnabled =
    !micEnabled;

  track.enabled =
    micEnabled;

  setStatus(
    micEnabled
      ? "🎤 Mic ON"
      : "🔇 Mic OFF"
  );

}


/* =========================
   SWITCH CAMERA
========================= */

async function switchCamera(){

  currentFacingMode =
    currentFacingMode === "user"
      ? "environment"
      : "user";

  if(!localStream) return;

  try{

    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:
            currentFacingMode
        },

        audio:true

      });

    const newVideoTrack =
      newStream.getVideoTracks()[0];

    const oldVideoTrack =
      localStream.getVideoTracks()[0];

    if(peerConnection){

      const sender =
        peerConnection
          .getSenders()
          .find(
            s =>
              s.track &&
              s.track.kind === "video"
          );

      if(sender){

        await sender.replaceTrack(
          newVideoTrack
        );

      }

    }

    oldVideoTrack.stop();

    localStream.removeTrack(
      oldVideoTrack
    );

    localStream.addTrack(
      newVideoTrack
    );

    localVideo.srcObject =
      localStream;

    setStatus(
      "🔄 Camera switched"
    );

  }catch(error){

    console.error(
      "Switch camera error:",
      error
    );

    alert(
      "Camera switch नहीं हो पाया।"
    );

  }

}


/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    localStream = null;

  }

  localVideo.srcObject =
    null;

  remoteVideo.srcObject =
    null;

  if(peerConnection){

    peerConnection.close();

    peerConnection =
      null;

  }

  setStatus(
    "⛔ Camera stopped"
  );

}


/* =========================
   AUTO JOIN FROM QR LINK
========================= */

window.addEventListener(
  "load",
  () => {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const room =
      params.get("room");

    if(room){

      setTimeout(
        () => {

          joinRoom(room);

        },
        1000
      );

    }

  }
);

</script>

</body>
                                      </html>
