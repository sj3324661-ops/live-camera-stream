<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Camera</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
  min-height:100vh;
}

header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0d1b2d;
  border-bottom:1px solid #263b55;
  font-size:20px;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:12px;
}

.video-box{
  position:relative;
  width:100%;
  height:58vh;
  min-height:350px;
  background:#000;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #29405f;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

#localVideo{
  position:absolute;
  right:10px;
  bottom:10px;
  width:110px;
  height:150px;
  object-fit:cover;
  background:#111;
  border:2px solid white;
  border-radius:14px;
  z-index:10;
}

#waiting{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#050b13;
  color:#b9c9db;
  font-size:17px;
  z-index:5;
}

.hidden{
  display:none!important;
}

.status{
  margin-top:10px;
  padding:12px;
  text-align:center;
  background:#101f33;
  border-radius:12px;
  color:#c8d8e9;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px 10px;
  margin-top:10px;
  color:white;
  background:#1769aa;
  font-size:15px;
  font-weight:bold;
}

.green{
  background:#16845b!important;
}

.red{
  background:#b83232!important;
}

.gray{
  background:#3a4a5c!important;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.controls button{
  margin-top:8px;
}

.panel{
  margin-top:14px;
  padding:18px;
  background:#0d1b2d;
  border:1px solid #263b55;
  border-radius:18px;
  text-align:center;
}

.panel h2{
  font-size:18px;
  margin-bottom:8px;
}

.panel p{
  color:#aabbd0;
  font-size:14px;
  margin-bottom:10px;
}

#qrcode{
  width:220px;
  height:220px;
  margin:15px auto;
  padding:10px;
  background:white;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#reader{
  width:100%;
  margin-top:12px;
  overflow:hidden;
  border-radius:12px;
}

.room{
  font-size:12px;
  color:#83a9d1;
  word-break:break-all;
}

@media(max-width:500px){

  .video-box{
    height:57vh;
    min-height:340px;
  }

  #localVideo{
    width:100px;
    height:140px;
  }

  header{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
📹 Live Camera
</header>

<div class="container">

  <!-- VIDEO -->
  <div class="video-box">

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline>
    </video>

    <div id="waiting">
      📡<br><br>
      दूसरे फोन के कनेक्ट होने का इंतज़ार...
    </div>

  </div>

  <!-- START -->
  <button
    id="startButton"
    class="green"
    onclick="createRoom()">
    🚀 Camera Start + QR बनाएं
  </button>

  <!-- STATUS -->
  <div id="status" class="status">
    🔵 Ready
  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <button
      id="cameraButton"
      class="green"
      onclick="toggleCamera()">
      📷 Camera ON
    </button>

    <button
      id="micButton"
      class="green"
      onclick="toggleMic()">
      🎙️ Mic ON
    </button>

    <button
      onclick="switchCamera()">
      🔄 Front / Back
    </button>

    <button
      class="red"
      onclick="stopCamera()">
      ⛔ Stop Camera
