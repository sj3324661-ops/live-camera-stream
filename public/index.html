<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Live Camera</title>

<!-- IMPORTANT: Server वाला Socket.IO -->
<script src="/socket.io/socket.io.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#remoteVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

#localVideo{
  position:fixed;
  right:10px;
  bottom:82px;
  width:95px;
  height:125px;
  object-fit:cover;
  background:#111;
  border:2px solid #fff;
  border-radius:12px;
  z-index:20;
}

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.5);
  z-index:30;
  font-size:18px;
  font-weight:bold;
}

#status{
  position:fixed;
  top:56px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  z-index:35;
}

#waiting{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(0,0,0,.45);
  z-index:5;
}

#startBtn{
  position:fixed;
  bottom:75px;
  left:50%;
  transform:translateX(-50%);
  padding:13px 20px;
  border:0;
  border-radius:12px;
  background:#159447;
  color:white;
  font-size:14px;
  font-weight:bold;
  z-index:50;
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:8px;
  display:flex;
  justify-content:center;
  gap:5px;
  z-index:40;
}

#controls button{
  padding:8px 9px;
  border:0;
  border-radius:8px;
  color:white;
  font-size:11px;
  font-weight:bold;
}

.green{background:#159447}
.red{background:#d93636}
.orange{background:#d97818}

#soundBtn{
  position:fixed;
  right:10px;
  top:55px;
  padding:8px 11px;
  border:0;
  border-radius:20px;
  background:#d97818;
  color:#fff;
  z-index:40;
}

#qrPanel,
#scannerPanel{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:350px;
  padding:18px;
  background:#101c2c;
  border:1px solid #35506d;
  border-radius:18px;
  text-align:center;
  z-index:100;
}

#qrcode{
  background:#fff;
  padding:10px;
  width:max-content;
  margin:15px auto;
  border-radius:10px;
}

#reader{
  width:100%;
  margin-top:10px;
}

#scanBtn{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#1769e0;
  color:white;
  font-weight:bold;
}

.closeBtn{
  padding:9px 16px;
  border:0;
  border-radius:8px;
  color:#fff;
  background:#d93636;
}

.hidden{
  display:none!important;
}

@media(max-width:380px){
  #localVideo{
    width:82px;
    height:110px;
  }

  #controls button{
    padding:7px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<header>📹 Live Camera</header>

<video id="remoteVideo" autoplay playsinline></video>

<video id="localVideo" autoplay muted playsinline></video>

<div id="waiting">
  <div>
    <h2>📡 Waiting...</h2>
    <p>दूसरे फोन के connect होने का इंतजार करें</p>
  </div>
</div>

<div id="status">🟡 Ready</div>

<button id="startBtn">
  🚀 Camera Start + QR
</button>

<button id="soundBtn" class="hidden">
  🔊 Sound
</button>

<div id="controls" class="hidden">

  <button id="cameraBtn" class="green">
    📷 Camera
  </button>

  <button id="micBtn" class="green">
    🎤 Mic
  </button>

  <button id="switchBtn" class="orange">
    🔄 Switch
  </button>

  <button id="stopBtn" class="red">
    ⛔ Stop
  </button>

</div>

<!-- QR PANEL -->
<div id="qrPanel" class="hidden">

  <h3>📱 Phone B को QR Scan कराएं</h3>

  <div id="qrcode"></div>

  <p id="roomText"></p>

  <button id="closeQR" class="closeBtn">
    ❌ Close
  </button>

</div>

<!-- SCANNER PANEL -->
<div id="scannerPanel">

  <h3>📷 QR Scan करें</h3>

  <button id="scanBtn">
    📷 QR Scanner Start
  </button>

  <div id="reader"></div>

  <br>

  <button id="closeScanner" class="closeBtn">
    ❌ Close
  </button>

</div>


<script>

console.log("LIVE CAMERA SCRIPT START");


/* =========================
   VARIABLES
========================= */

let socket;
let localStream = null;
let remoteStream = new MediaStream();
let peerConnection = null;

let roomId = null;
let initiator = false;

let pendingCandidates = [];

let facingMode = "user";
let scanner = null;


/* =========================
   ELEMENTS
========================= */

const startBtn =
document.getElementById("startBtn");

const remoteVideo =
document.getElementById("remoteVideo");

const localVideo =
document.getElementById("localVideo");

const waiting =
document.getElementById("waiting");

const statusBox =
document.getElementById("status");

const controls =
document.getElementById("controls");

const cameraBtn =
document.getElementById("cameraBtn");

const micBtn =
document.getElementById("micBtn");

const switchBtn =
document.getElementById("switchBtn");

const stopBtn =
document.getElementById("stopBtn");

const soundBtn =
document.getElementById("soundBtn");

const qrPanel =
document.getElementById("qrPanel");

const scannerPanel =
document.getElementById("scannerPanel");

const scanBtn =
document.getElementById("scanBtn");

const closeQRBtn =
document.getElementById("closeQR");

const closeScannerBtn =
document.getElementById("closeScanner");

const qrcodeBox =
document.getElementById("qrcode");

const roomText =
document.getElementById("roomText");


/* =========================
   SOCKET
========================= */

try{

  socket = io();

  socket.on("connect",function(){

    console.log(
      "SOCKET CONNECTED",
      socket.id
    );

    setStatus(
      "🟢 Server connected"
    );

  });

}
catch(error){

  console.error(error);

  setStatus(
    "❌ Server connection error"
  );

}


/* =========================
   STATUS
========================= */

function setStatus(text){

  statusBox.innerText = text;

  console.log(text);

}


/* =========================
   CAMERA
========================= */

async function startCamera(){

  try{

    localStream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:facingMode,
        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:true

    });

    localVideo.srcObject =
    localStream;

    controls.classList.remove(
      "hidden"
    );

    setStatus(
      "📷 Camera ON"
    );

    return true;

  }
  catch(error){

    console.error(
      "CAMERA ERROR:",
      error
    );

    alert(
      "Camera और Microphone की Permission Allow करें।"
    );

    return false;

  }

}


/* =========================
   CREATE ROOM
========================= */

async function createRoom(){

  initiator = true;

  roomId =
  Math.random()
  .toString(36)
  .substring(2,8)
  .toUpperCase();

  console.log(
    "ROOM:",
    roomId
  );

  const ok =
  await startCamera();

  if(!ok)return;

  socket.emit(
    "join-room",
    roomId
  );

  showQR();

  startBtn.classList.add(
    "hidden"
  );

  scannerPanel.classList.add(
    "hidden"
  );

  setStatus(
    "📱 QR तैयार है"
  );

}


/* =========================
   QR
========================= */

function showQR(){

  qrPanel.classList.remove(
    "hidden"
  );

  qrcodeBox.innerHTML = "";

  const qrURL =
    window.location.origin +
    "/?room=" +
    encodeURIComponent(roomId);

  new QRCode(
    qrcodeBox,
    {
      text:qrURL,
      width:220,
      height:220
    }
  );

  roomText.innerText =
    "Room: " + roomId;

}


/* =========================
   JOIN ROOM
========================= */

async function joinRoom(id){

  roomId = id;

  initiator = false;

  const ok =
  await startCamera();

  if(!ok)return;

  startBtn.classList.add(
    "hidden"
  );

  qrPanel.classList.add(
    "hidden"
  );

  scannerPanel.classList.add(
    "hidden"
  );

  socket.emit(
    "join-room",
    roomId
  );

  setStatus(
    "🔗 Room join हो रहा है..."
  );

}


/* =========================
   PEER
========================= */

function createPeer(){

  if(peerConnection){
    return peerConnection;
  }

  peerConnection =
  new RTCPeerConnection({

    iceServers:[
      {
        urls:
        "stun:stun.l.google.com:19302"
      },
      {
        urls:
        "stun:stun1.l.google.com:19302"
      },
      {
        urls:
        "stun:stun2.l.google.com:19302"
      }
    ]

  });


  /* SEND LOCAL CAMERA */

  if(localStream){

    localStream
    .getTracks()
    .forEach(function(track){

      peerConnection.addTrack(
        track,
        localStream
      );

    });

  }


  /* RECEIVE OTHER CAMERA */

  peerConnection.ontrack =
  function(event){

    console.log(
      "REMOTE TRACK:",
      event.track.kind
    );

    if(
      !remoteStream
    ){

      remoteStream =
      new MediaStream();

    }

    remoteStream.addTrack(
      event.track
    );

    remoteVideo.srcObject =
    remoteStream;

    waiting.classList.add(
      "hidden"
    );

    soundBtn.classList.remove(
      "hidden"
    );

    remoteVideo.play()
    .catch(function(error){
      console.log(error);
    });

    setStatus(
      "🟢 दूसरा फोन LIVE है"
    );

  };


  /* ICE */

  peerConnection.onicecandidate =
  function(event){

    if(event.candidate){

      socket.emit(
        "ice-candidate",
        {
          roomId:roomId,
          candidate:event.candidate
        }
      );

    }

  };


  peerConnection.onconnectionstatechange =
  function(){

    console.log(
      "CONNECTION:",
      peerConnection.connectionState
    );

    if(
      peerConnection.connectionState ===
      "connected"
    ){

      waiting.classList.add(
        "hidden"
      );

      setStatus(
        "🟢 दोनों फोन CONNECTED"
      );

    }

    if(
      peerConnection.connectionState ===
      "failed"
    ){

      setStatus(
        "❌ Connection failed"
      );

    }

  };

  return peerConnection;

}


/* =========================
   OFFER
========================= */

async function sendOffer(){

  const pc =
  createPeer();

  const offer =
  await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  socket.emit(
    "offer",
    {
      roomId:roomId,
      offer:pc.localDescription
    }
  );

  setStatus(
    "📡 Offer भेजा गया"
  );

}


/* =========================
   PEER JOINED
========================= */

socket.on(
  "peer-joined",
  async function(){

    console.log(
      "PEER JOINED"
    );

    setStatus(
      "📱 दूसरा फोन मिल गया"
    );

    if(initiator){

      await sendOffer();

    }

  }
);


/* =========================
   PEER READY
========================= */

socket.on(
  "peer-ready",
  async function(){

    console.log(
      "PEER READY"
    );

    if(initiator){

      if(!peerConnection){

        await sendOffer();

      }

    }

  }
);


/* =========================
   OFFER RECEIVED
========================= */

socket.on(
  "offer",
  async function(offer){

    console.log(
      "OFFER RECEIVED"
    );

    const pc =
    createPeer();

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );

    for(
      const candidate
      of pendingCandidates
    ){

      try{

        await pc.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      }catch(error){

        console.log(error);

      }

    }

    pendingCandidates = [];

    const answer =
    await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    socket.emit(
      "answer",
      {
        roomId:roomId,
        answer:pc.localDescription
      }
    );

    setStatus(
      "📡 Answer भेजा गया"
    );

  }
);


/* =========================
   ANSWER
========================= */

socket.on(
  "answer",
  async function(answer){

    console.log(
      "ANSWER RECEIVED"
    );

    if(!peerConnection)return;

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(
        answer
      )
    );

    for(
      const candidate
      of pendingCandidates
    ){

      try{

        await peerConnection.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      }catch(error){

        console.log(error);

      }

    }

    pendingCandidates = [];

    setStatus(
      "🟢 Connection ready"
    );

  }
);


/* =========================
   ICE
========================= */

socket.on(
  "ice-candidate",
  async function(candidate){

    if(
      peerConnection &&
      peerConnection.remoteDescription
    ){

      try{

        await peerConnection.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      }catch(error){

        console.log(error);

      }

    }
    else{

      pendingCandidates.push(
        candidate
      );

    }

  }
);


/* =========================
   ROOM FULL
========================= */

socket.on(
  "room-full",
  function(){

    alert(
      "यह Room पहले से 2 फोन से connected है।"
    );

    setStatus(
      "❌ Room Full"
    );

  }
);


/* =========================
   CAMERA BUTTON
========================= */

cameraBtn.addEventListener(
  "click",
  function(){

    if(!localStream)return;

    const track =
    localStream.getVideoTracks()[0];

    if(!track)return;

    track.enabled =
    !track.enabled;

    cameraBtn.innerText =
    track.enabled
    ? "📷 Camera"
    : "🚫 Camera";

  }
);


/* =========================
   MIC
========================= */

micBtn.addEventListener(
  "click",
  function(){

    if(!localStream)return;

    const track =
    localStream.getAudioTracks()[0];

    if(!track)return;

    track.enabled =
    !track.enabled;

    micBtn.innerText =
    track.enabled
    ? "🎤 Mic"
    : "🔇 Mic";

  }
);


/* =========================
   SWITCH CAMERA
========================= */

switchBtn.addEventListener(
  "click",
  async function(){

    if(!localStream)return;

    facingMode =
    facingMode === "user"
    ? "environment"
    : "user";

    try{

      const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:facingMode
        },

        audio:false

      });

      const newTrack =
      stream.getVideoTracks()[0];

      const sender =
      peerConnection &&
      peerConnection
      .getSenders()
      .find(function(s){

        return s.track &&
        s.track.kind === "video";

      });

      if(sender){

        await sender.replaceTrack(
          newTrack
        );

      }

      const oldTrack =
      localStream.getVideoTracks()[0];

      if(oldTrack){

        oldTrack.stop();

        localStream.removeTrack(
          oldTrack
        );

      }

      localStream.addTrack(
        newTrack
      );

      localVideo.srcObject =
      localStream;

      setStatus(
        "🔄 Camera switched"
      );

    }
    catch(error){

      console.error(error);

      setStatus(
        "❌ Camera switch failed"
      );

    }

  }
);


/* =========================
   STOP
========================= */

stopBtn.addEventListener(
  "click",
  function(){

    if(localStream){

      localStream
      .getTracks()
      .forEach(function(track){
        track.stop();
      });

      localStream = null;

    }

    localVideo.srcObject = null;

    setStatus(
      "⛔ Camera stopped"
    );

  }
);


/* =========================
   SOUND
========================= */

soundBtn.addEventListener(
  "click",
  async function(){

    remoteVideo.muted = false;

    remoteVideo.volume = 1;

    try{

      await remoteVideo.play();

    }catch(error){

      console.log(error);

    }

  }
);


/* =========================
   START
========================= */

startBtn.addEventListener(
  "click",
  function(){

    createRoom();

  }
);


/* =========================
   CLOSE QR
========================= */

closeQRBtn.addEventListener(
  "click",
  function(){

    qrPanel.classList.add(
      "hidden"
    );

  }
);


/* =========================
   QR SCANNER
========================= */

scanBtn.addEventListener(
  "click",
  async function(){

    if(scanner)return;

    if(
      typeof Html5Qrcode ===
      "undefined"
    ){

      alert(
        "QR Scanner load नहीं हुआ।"
      );

      return;

    }

    scanner =
    new Html5Qrcode(
      "reader"
    );

    try{

      await scanner.start(

        {
          facingMode:"environment"
        },

        {
          fps:10,
          qrbox:250
        },

        async function(decodedText){

          console.log(
            "QR FOUND:",
            decodedText
          );

          let url;

          try{

            url =
            new URL(decodedText);

          }
          catch(error){

            return;

          }

          const room =
          url.searchParams.get(
            "room"
          );

          if(!room)return;

          try{

            await scanner.stop();

            scanner.clear();

          }catch(error){

            console.log(error);

          }

          scanner = null;

          await joinRoom(room);

        }

      );

      setStatus(
        "📷 QR Scanner चालू है"
      );

    }
    catch(error){

      console.error(error);

      scanner = null;

      alert(
        "Camera Permission Allow करें।"
      );

    }

  }
);


/* =========================
   CLOSE SCANNER
========================= */

closeScannerBtn.addEventListener(
  "click",
  async function(){

    if(scanner){

      try{

        await scanner.stop();

        scanner.clear();

      }catch(error){

        console.log(error);

      }

      scanner = null;

    }

    document.getElementById(
      "reader"
    ).innerHTML = "";

    setStatus(
      "🟡 Ready"
    );

  }
);


/* =========================
   AUTO JOIN
========================= */

window.addEventListener(
  "load",
  function(){

    const params =
    new URLSearchParams(
      window.location.search
    );

    const room =
    params.get("room");

    if(room){

      joinRoom(room);

    }

  }
);

</script>

</body>
  </html>
