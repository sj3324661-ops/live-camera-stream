<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Camera</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#remoteVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

#localVideo{
  position:fixed;
  right:10px;
  bottom:80px;
  width:95px;
  height:125px;
  object-fit:cover;
  background:#111;
  border:2px solid white;
  border-radius:10px;
  z-index:20;
}

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:45px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.45);
  z-index:30;
  font-weight:bold;
}

#status{
  position:fixed;
  top:55px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.6);
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  z-index:30;
}

#waiting{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(0,0,0,.45);
  z-index:5;
}

#startBtn{
  position:fixed;
  bottom:75px;
  left:50%;
  transform:translateX(-50%);
  padding:13px 20px;
  border:0;
  border-radius:12px;
  background:#159447;
  color:white;
  font-weight:bold;
  z-index:50;
}

#controls{
  position:fixed;
  bottom:8px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:5px;
  z-index:40;
}

#controls button{
  padding:8px 9px;
  border:0;
  border-radius:8px;
  color:white;
  font-size:11px;
  font-weight:bold;
}

.green{
  background:#159447;
}

.red{
  background:#d93636;
}

.orange{
  background:#d97818;
}

#soundBtn{
  position:fixed;
  top:55px;
  right:10px;
  border:0;
  border-radius:20px;
  padding:8px 11px;
  background:#d97818;
  color:white;
  z-index:40;
}

#qrPanel,
#scannerPanel{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:350px;
  padding:18px;
  background:#101c2c;
  border-radius:18px;
  text-align:center;
  z-index:100;
}

#qrcode{
  background:white;
  padding:10px;
  width:max-content;
  margin:15px auto;
  border-radius:10px;
}

#reader{
  width:100%;
  margin-top:10px;
}

#scanBtn{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#1769e0;
  color:white;
  font-weight:bold;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<header>📹 Live Camera</header>

<video id="remoteVideo" autoplay playsinline></video>

<video id="localVideo" autoplay muted playsinline></video>

<div id="waiting">
  <div>
    <h2>📡 Waiting...</h2>
    <p>दूसरे फोन के connect होने का इंतजार करें</p>
  </div>
</div>

<div id="status">🟡 Ready</div>

<button id="startBtn">
  🚀 Camera Start + QR
</button>

<button id="soundBtn" class="hidden">
  🔊 Sound
</button>

<div id="controls" class="hidden">

  <button id="cameraBtn" class="green">
    📷 Camera
  </button>

  <button id="micBtn" class="green">
    🎤 Mic
  </button>

  <button id="switchBtn" class="orange">
    🔄 Switch
  </button>

  <button id="stopBtn" class="red">
    ⛔ Stop
  </button>

</div>

<!-- QR -->
<div id="qrPanel" class="hidden">

  <h3>📱 Phone B को Scan कराएं</h3>

  <div id="qrcode"></div>

  <p id="roomText"></p>

  <button onclick="closeQR()" class="red">
    ❌ Close
  </button>

</div>

<!-- SCANNER -->
<div id="scannerPanel">

  <h3>📷 QR Scan करें</h3>

  <button id="scanBtn">
    📷 QR Scanner Start
  </button>

  <div id="reader"></div>

  <br>

  <button onclick="closeScanner()" class="red">
    ❌ Close
  </button>

</div>

<script>

console.log("SCRIPT STARTED");

/* =====================
VARIABLES
===================== */

let socket = io();

let localStream = null;
let remoteStream = new MediaStream();
let peerConnection = null;

let roomId = null;
let initiator = false;

let pendingCandidates = [];

let facingMode = "user";

let scanner = null;


/* =====================
ELEMENTS
===================== */

const startBtn =
document.getElementById("startBtn");

const localVideo =
document.getElementById("localVideo");

const remoteVideo =
document.getElementById("remoteVideo");

const waiting =
document.getElementById("waiting");

const statusBox =
document.getElementById("status");

const controls =
document.getElementById("controls");

const qrPanel =
document.getElementById("qrPanel");

const scannerPanel =
document.getElementById("scannerPanel");

const qrcodeBox =
document.getElementById("qrcode");

const roomText =
document.getElementById("roomText");

const cameraBtn =
document.getElementById("cameraBtn");

const micBtn =
document.getElementById("micBtn");

const switchBtn =
document.getElementById("switchBtn");

const stopBtn =
document.getElementById("stopBtn");

const scanBtn =
document.getElementById("scanBtn");

const soundBtn =
document.getElementById("soundBtn");


/* =====================
STATUS
===================== */

function setStatus(text){

  statusBox.innerText = text;

  console.log(text);

}


/* =====================
START CAMERA
===================== */

async function startCamera(){

  try{

    if(!navigator.mediaDevices){

      alert("इस browser में Camera API उपलब्ध नहीं है।");

      return false;

    }

    localStream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:facingMode,
        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:true

    });

    localVideo.srcObject =
    localStream;

    controls.classList.remove("hidden");

    setStatus("📷 Camera ON");

    return true;

  }

  catch(error){

    console.error(error);

    alert(
      "Camera/Microphone Permission Allow करें।"
    );

    setStatus("❌ Camera permission problem");

    return false;

  }

}


/* =====================
CREATE ROOM
===================== */

async function createRoom(){

  console.log("CREATE ROOM CLICK");

  initiator = true;

  roomId =
  Math.random()
  .toString(36)
  .substring(2,8)
  .toUpperCase();

  const ok =
  await startCamera();

  if(!ok) return;

  socket.emit(
    "join-room",
    roomId
  );

  showQR();

  startBtn.classList.add("hidden");

  scannerPanel.classList.add("hidden");

  setStatus(
    "📱 QR तैयार है — Phone B Scan करे"
  );

}


/* =====================
SHOW QR
===================== */

function showQR(){

  qrPanel.classList.remove("hidden");

  qrcodeBox.innerHTML = "";

  const qrURL =
  window.location.origin +
  "/?room=" +
  encodeURIComponent(roomId);

  new QRCode(
    qrcodeBox,
    {
      text:qrURL,
      width:220,
      height:220
    }
  );

  roomText.innerText =
  "Room: " + roomId;

}


/* =====================
CLOSE QR
===================== */

function closeQR(){

  qrPanel.classList.add("hidden");

}


/* =====================
JOIN ROOM
===================== */

async function joinRoom(id){

  console.log(
    "JOIN ROOM:",
    id
  );

  roomId = id;

  initiator = false;

  const ok =
  await startCamera();

  if(!ok) return;

  startBtn.classList.add("hidden");

  qrPanel.classList.add("hidden");

  scannerPanel.classList.add("hidden");

  socket.emit(
    "join-room",
    roomId
  );

  setStatus(
    "🔗 Room join हो रहा है..."
  );

}


/* =====================
PEER CONNECTION
===================== */

function createPeer(){

  if(peerConnection){

    return peerConnection;

  }

  peerConnection =
  new RTCPeerConnection({

    iceServers:[

      {
        urls:
        "stun:stun.l.google.com:19302"
      },

      {
        urls:
        "stun:stun1.l.google.com:19302"
      }

    ]

  });


  /* LOCAL */

  if(localStream){

    localStream
    .getTracks()
    .forEach(track => {

      peerConnection.addTrack(
        track,
        localStream
      );

    });

  }


  /* REMOTE */

  peerConnection.ontrack =
  async(event) => {

    console.log(
      "REMOTE TRACK:",
      event.track.kind
    );

    const exists =
    remoteStream
    .getTracks()
    .some(
      t => t.id === event.track.id
    );

    if(!exists){

      remoteStream.addTrack(
        event.track
      );

    }

    remoteVideo.srcObject =
    remoteStream;

    waiting.classList.add("hidden");

    soundBtn.classList.remove("hidden");

    try{

      await remoteVideo.play();

    }catch(e){

      console.log(e);

    }

    setStatus(
      "🟢 दूसरा फोन LIVE है"
    );

  };


  /* ICE */

  peerConnection.onicecandidate =
  event => {

    if(event.candidate){

      socket.emit(
        "ice-candidate",
        {
          roomId:roomId,
          candidate:event.candidate
        }
      );

    }

  };


  peerConnection.onconnectionstatechange =
  () => {

    console.log(
      "STATE:",
      peerConnection.connectionState
    );

    if(
      peerConnection.connectionState ===
      "connected"
    ){

      setStatus(
        "🟢 दोनों फोन CONNECTED"
      );

      waiting.classList.add("hidden");

    }

  };


  return peerConnection;

}


/* =====================
SEND OFFER
===================== */

async function sendOffer(){

  const pc =
  createPeer();

  const offer =
  await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  socket.emit(
    "offer",
    {
      roomId:roomId,
      offer:pc.localDescription
    }
  );

  setStatus(
    "📡 Offer भेजा गया"
  );

}


/* =====================
SOCKET CONNECT
===================== */

socket.on(
  "connect",
  () => {

    console.log(
      "SOCKET CONNECTED"
    );

    setStatus(
      "🟢 Server connected"
    );

  }
);


/* =====================
PEER JOINED
===================== */

socket.on(
  "peer-joined",
  async() => {

    console.log(
      "PEER JOINED"
    );

    setStatus(
      "📱 दूसरा फोन मिल गया"
    );

    if(initiator){

      await sendOffer();

    }

  }
);


/* =====================
OFFER
===================== */

socket.on(
  "offer",
  async(offer) => {

    console.log(
      "OFFER RECEIVED"
    );

    const pc =
    createPeer();

    await pc.setRemoteDescription(
      new RTCSessionDescription(offer)
    );


    for(
      const candidate
      of pendingCandidates
    ){

      try{

        await pc.addIceCandidate(
          new RTCIceCandidate(candidate)
        );

      }catch(e){

        console.log(e);

      }

    }

    pendingCandidates = [];


    const answer =
    await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    socket.emit(
      "answer",
      {
        roomId:roomId,
        answer:pc.localDescription
      }
    );

    setStatus(
      "📡 Answer भेजा गया"
    );

  }
);


/* =====================
ANSWER
===================== */

socket.on(
  "answer",
  async(answer) => {

    console.log(
      "ANSWER RECEIVED"
    );

    if(!peerConnection){

      return;

    }

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(answer)
    );


    for(
      const candidate
      of pendingCandidates
    ){

      try{

        await peerConnection.addIceCandidate(
          new RTCIceCandidate(candidate)
        );

      }catch(e){

        console.log(e);

      }

    }

    pendingCandidates = [];

    setStatus(
      "🟢 Connection ready"
    );

  }
);


/* =====================
ICE
===================== */

socket.on(
  "ice-candidate",
  async(candidate) => {

    console.log(
      "ICE RECEIVED"
    );

    if(
      peerConnection &&
      peerConnection.remoteDescription
    ){

      try{

        await peerConnection.addIceCandidate(
          new RTCIceCandidate(candidate)
        );

      }catch(e){

        console.log(e);

      }

    }

    else{

      pendingCandidates.push(
        candidate
      );

    }

  }
);


/* =====================
ROOM FULL
===================== */

socket.on(
  "room-full",
  () => {

    alert(
      "यह Room पहले से 2 फोन से connected है।"
    );

    setStatus(
      "❌ Room Full"
    );

  }
);


/* =====================
CAMERA BUTTON
===================== */

cameraBtn.onclick =
function(){

  if(!localStream) return;

  const track =
  localStream.getVideoTracks()[0];

  if(!track) return;

  track.enabled =
  !track.enabled;

  cameraBtn.innerText =
  track.enabled
  ? "📷 Camera"
  : "🚫 Camera";

  setStatus(
    track.enabled
    ? "📷 Camera ON"
    : "🚫 Camera OFF"
  );

};


/* =====================
MIC BUTTON
===================== */

micBtn.onclick =
function(){

  if(!localStream) return;

  const track =
  localStream.getAudioTracks()[0];

  if(!track) return;

  track.enabled =
  !track.enabled;

  micBtn.innerText =
  track.enabled
  ? "🎤 Mic"
  : "🔇 Mic";

  setStatus(
    track.enabled
    ? "🎤 Mic ON"
    : "🔇 Mic OFF"
  );

};


/* =====================
SWITCH CAMERA
===================== */

switchBtn.onclick =
async function(){

  if(!localStream){

    return;

  }

  facingMode =
  facingMode === "user"
  ? "environment"
  : "user";

  try{

    const stream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:facingMode
      },

      audio:false

    });

    const newTrack =
    stream.getVideoTracks()[0];

    const sender =
    peerConnection &&
    peerConnection
    .getSenders()
    .find(
      s =>
      s.track &&
      s.track.kind === "video"
    );

    if(sender){

      await sender.replaceTrack(
        newTrack
      );

    }

    const oldTrack =
    localStream.getVideoTracks()[0];

    if(oldTrack){

      oldTrack.stop();

      localStream.removeTrack(
        oldTrack
      );

    }

    localStream.addTrack(
      newTrack
    );

    localVideo.srcObject =
    localStream;

    setStatus(
      "🔄 Camera switched"
    );

  }

  catch(error){

    console.error(error);

    setStatus(
      "❌ Camera switch failed"
    );

  }

};


/* =====================
SOUND
===================== */

soundBtn.onclick =
async function(){

  remoteVideo.muted = false;

  remoteVideo.volume = 1;

  try{

    await remoteVideo.play();

  }catch(e){

    console.log(e);

  }

  setStatus(
    "🔊 Sound ON"
  );

};


/* =====================
STOP
===================== */

stopBtn.onclick =
function(){

  if(localStream){

    localStream
    .getTracks()
    .forEach(
      track => track.stop()
    );

    localStream = null;

  }

  localVideo.srcObject = null;

  cameraBtn.innerText =
  "📷 Camera";

  micBtn.innerText =
  "🎤 Mic";

  setStatus(
    "⛔ Camera stopped"
  );

};


/* =====================
START BUTTON
===================== */

startBtn.onclick =
function(){

  console.log(
    "START BUTTON CLICK"
  );

  createRoom();

};


/* =====================
QR SCANNER
===================== */

scanBtn.onclick =
async function(){

  console.log(
    "SCAN BUTTON CLICK"
  );

  if(scanner){

    return;

  }

  scanner =
  new Html5Qrcode(
    "reader"
  );

  try{

    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,
        qrbox:250
      },

      async(decodedText) => {

        console.log(
          "QR FOUND:",
          decodedText
        );

        let url;

        try{

          url =
          new URL(decodedText);

        }

        catch(e){

          alert("Invalid QR");

          return;

        }

        const room =
        url.searchParams.get("room");

        if(!room){

          alert(
            "Room ID नहीं मिला"
          );

          return;

        }

        try{

          await scanner.stop();

          scanner.clear();

        }catch(e){

          console.log(e);

        }

        scanner = null;

        await joinRoom(room);

      }

    );

    setStatus(
      "📷 QR Scanner चालू है"
    );

  }

  catch(error){

    console.error(error);

    alert(
      "Camera permission Allow करें।"
    );

  }

};


/* =====================
CLOSE SCANNER
===================== */

async function closeScanner(){

  if(scanner){

    try{

      await scanner.stop();

      scanner.clear();

    }catch(e){

      console.log(e);

    }

    scanner = null;

  }

  document.getElementById(
    "reader"
  ).innerHTML = "";

}


/* =====================
AUTO JOIN
===================== */

window.addEventListener(
  "load",
  function(){

    const params =
    new URLSearchParams(
      window.location.search
    );

    const room =
    params.get("room");

    if(room){

      joinRoom(room);

    }

  }
);

</script>

</body>
  </html>
