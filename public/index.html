<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Live Camera</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#remoteVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

#localVideo{
  position:fixed;
  right:10px;
  bottom:82px;
  width:95px;
  height:125px;
  object-fit:cover;
  background:#111;
  border:2px solid #fff;
  border-radius:11px;
  z-index:20;
}

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:45px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.45);
  z-index:30;
  font-size:18px;
  font-weight:bold;
}

#status{
  position:fixed;
  top:55px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  z-index:35;
  white-space:nowrap;
}

#waiting{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(0,0,0,.45);
  z-index:5;
}

#startBtn{
  position:fixed;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  padding:13px 20px;
  border:0;
  border-radius:12px;
  background:#159447;
  color:#fff;
  font-size:14px;
  font-weight:bold;
  z-index:50;
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:8px;
  display:flex;
  justify-content:center;
  gap:5px;
  z-index:40;
}

#controls button{
  padding:8px 9px;
  border:0;
  border-radius:8px;
  color:#fff;
  font-size:11px;
  font-weight:bold;
}

.green{
  background:#159447;
}

.red{
  background:#d93636;
}

.orange{
  background:#d97818;
}

#soundBtn{
  position:fixed;
  right:10px;
  top:55px;
  padding:8px 11px;
  border:0;
  border-radius:20px;
  background:#d97818;
  color:#fff;
  font-size:12px;
  font-weight:bold;
  z-index:40;
}

#qrPanel,
#scannerPanel{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:350px;
  padding:18px;
  background:#101c2c;
  border:1px solid #35506d;
  border-radius:18px;
  text-align:center;
  z-index:100;
}

#qrcode{
  background:#fff;
  padding:10px;
  width:max-content;
  margin:15px auto;
  border-radius:10px;
}

#reader{
  width:100%;
  margin-top:10px;
}

#scanBtn{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#1769e0;
  color:#fff;
  font-weight:bold;
}

.closeBtn{
  padding:9px 15px;
  border:0;
  border-radius:8px;
  color:#fff;
  background:#d93636;
}

.hidden{
  display:none!important;
}

@media(max-width:380px){

  #localVideo{
    width:82px;
    height:110px;
    right:8px;
    bottom:82px;
  }

  #controls button{
    padding:7px;
    font-size:10px;
  }

}
</style>
</head>

<body>

<header>📹 Live Camera</header>

<!-- दूसरे फोन का कैमरा -->
<video
  id="remoteVideo"
  autoplay
  playsinline>
</video>

<!-- अपना कैमरा -->
<video
  id="localVideo"
  autoplay
  muted
  playsinline>
</video>

<div id="waiting">
  <div>
    <h2>📡 Waiting...</h2>
    <p>दूसरे फोन के connect होने का इंतजार करें</p>
  </div>
</div>

<div id="status">🟡 Ready</div>

<button id="startBtn">
  🚀 Camera Start + QR
</button>

<button id="soundBtn" class="hidden">
  🔊 Sound
</button>

<div id="controls" class="hidden">

  <button id="cameraBtn" class="green">
    📷 Camera
  </button>

  <button id="micBtn" class="green">
    🎤 Mic
  </button>

  <button id="switchBtn" class="orange">
    🔄 Switch
  </button>

  <button id="stopBtn" class="red">
    ⛔ Stop
  </button>

</div>

<!-- QR PANEL -->
<div id="qrPanel" class="hidden">

  <h3>📱 Phone B को QR Scan कराएं</h3>

  <div id="qrcode"></div>

  <p id="roomText"></p>

  <button
    class="closeBtn"
    onclick="closeQR()">
    ❌ Close
  </button>

</div>

<!-- SCANNER PANEL -->
<div id="scannerPanel">

  <h3>📷 QR Scan करें</h3>

  <button id="scanBtn">
    📷 QR Scanner Start
  </button>

  <div id="reader"></div>

  <br>

  <button
    class="closeBtn"
    onclick="closeScanner()">
    ❌ Close
  </button>

</div>


<script>

/* =================================
   SOCKET
================================= */

const socket = io();


/* =================================
   VARIABLES
================================= */

let localStream = null;

let remoteStream = new MediaStream();

let peerConnection = null;

let roomId = null;

let initiator = false;

let pendingCandidates = [];

let facingMode = "user";

let scanner = null;


/* =================================
   ELEMENTS
================================= */

const startBtn =
document.getElementById("startBtn");

const remoteVideo =
document.getElementById("remoteVideo");

const localVideo =
document.getElementById("localVideo");

const waiting =
document.getElementById("waiting");

const statusBox =
document.getElementById("status");

const controls =
document.getElementById("controls");

const cameraBtn =
document.getElementById("cameraBtn");

const micBtn =
document.getElementById("micBtn");

const switchBtn =
document.getElementById("switchBtn");

const stopBtn =
document.getElementById("stopBtn");

const soundBtn =
document.getElementById("soundBtn");

const qrPanel =
document.getElementById("qrPanel");

const scannerPanel =
document.getElementById("scannerPanel");

const scanBtn =
document.getElementById("scanBtn");

const qrcodeBox =
document.getElementById("qrcode");

const roomText =
document.getElementById("roomText");


/* =================================
   STATUS
================================= */

function setStatus(text){

  statusBox.innerText = text;

  console.log(text);

}


/* =================================
   START LOCAL CAMERA
================================= */

async function startCamera(){

  try{

    if(!navigator.mediaDevices){

      alert(
        "इस browser में Camera उपलब्ध नहीं है।"
      );

      return false;
    }

    if(localStream){

      localStream
      .getTracks()
      .forEach(track => track.stop());

    }

    localStream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:facingMode,
        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:true

    });

    localVideo.srcObject =
    localStream;

    controls.classList.remove("hidden");

    setStatus("📷 Camera ON");

    return true;

  }

  catch(error){

    console.error(
      "CAMERA ERROR:",
      error
    );

    alert(
      "Camera और Microphone की permission Allow करें।"
    );

    setStatus(
      "❌ Camera permission problem"
    );

    return false;
  }

}


/* =================================
   CREATE ROOM
================================= */

async function createRoom(){

  initiator = true;

  roomId =
  Math.random()
  .toString(36)
  .substring(2,8)
  .toUpperCase();

  console.log(
    "CREATED ROOM:",
    roomId
  );

  const ok =
  await startCamera();

  if(!ok) return;

  socket.emit(
    "join-room",
    roomId
  );

  showQR();

  startBtn.classList.add("hidden");

  scannerPanel.classList.add("hidden");

  setStatus(
    "📱 QR तैयार है"
  );

}


/* =================================
   QR
================================= */

function showQR(){

  qrPanel.classList.remove("hidden");

  qrcodeBox.innerHTML = "";

  const url =
  window.location.origin +
  "/?room=" +
  encodeURIComponent(roomId);

  new QRCode(
    qrcodeBox,
    {
      text:url,
      width:220,
      height:220
    }
  );

  roomText.innerText =
  "Room: " + roomId;

}


function closeQR(){

  qrPanel.classList.add("hidden");

}


/* =================================
   JOIN ROOM
================================= */

async function joinRoom(id){

  roomId = id;

  initiator = false;

  console.log(
    "JOINING ROOM:",
    roomId
  );

  const ok =
  await startCamera();

  if(!ok) return;

  startBtn.classList.add("hidden");

  qrPanel.classList.add("hidden");

  scannerPanel.classList.add("hidden");

  socket.emit(
    "join-room",
    roomId
  );

  setStatus(
    "🔗 Room join हो रहा है..."
  );

}


/* =================================
   CREATE PEER CONNECTION
================================= */

function createPeer(){

  if(peerConnection){

    return peerConnection;

  }

  console.log(
    "CREATING PEER CONNECTION"
  );

  peerConnection =
  new RTCPeerConnection({

    iceServers:[

      {
        urls:
        "stun:stun.l.google.com:19302"
      },

      {
        urls:
        "stun:stun1.l.google.com:19302"
      },

      {
        urls:
        "stun:stun2.l.google.com:19302"
      }

    ]

  });


  /* ===============================
     SEND LOCAL TRACKS
  =============================== */

  if(localStream){

    localStream
    .getTracks()
    .forEach(track => {

      console.log(
        "ADDING LOCAL TRACK:",
        track.kind
      );

      peerConnection.addTrack(
        track,
        localStream
      );

    });

  }


  /* ===============================
     RECEIVE REMOTE TRACKS
  =============================== */

  peerConnection.ontrack =
  async(event) => {

    console.log(
      "REMOTE TRACK RECEIVED:",
      event.track.kind
    );

    const exists =
    remoteStream
    .getTracks()
    .some(
      track =>
      track.id === event.track.id
    );

    if(!exists){

      remoteStream.addTrack(
        event.track
      );

    }

    remoteVideo.srcObject =
    remoteStream;

    waiting.classList.add("hidden");

    soundBtn.classList.remove("hidden");

    try{

      await remoteVideo.play();

    }

    catch(error){

      console.log(
        "PLAY ERROR:",
        error
      );

    }

    setStatus(
      "🟢 दूसरा फोन LIVE है"
    );

  };


  /* ===============================
     ICE
  =============================== */

  peerConnection.onicecandidate =
  event => {

    if(event.candidate){

      socket.emit(
        "ice-candidate",
        {
          roomId:roomId,
          candidate:event.candidate
        }
      );

    }

  };


  /* ===============================
     CONNECTION STATE
  =============================== */

  peerConnection.onconnectionstatechange =
  () => {

    const state =
    peerConnection.connectionState;

    console.log(
      "CONNECTION STATE:",
      state
    );

    if(state === "connected"){

      waiting.classList.add("hidden");

      setStatus(
        "🟢 दोनों फोन CONNECTED"
      );

    }

    if(state === "connecting"){

      setStatus(
        "🟡 Connecting..."
      );

    }

    if(state === "disconnected"){

      setStatus(
        "🟠 Connection disconnected"
      );

    }

    if(state === "failed"){

      setStatus(
        "❌ Connection failed"
      );

    }

  };


  /* ===============================
     ICE CONNECTION STATE
  =============================== */

  peerConnection.oniceconnectionstatechange =
  () => {

    console.log(
      "ICE STATE:",
      peerConnection.iceConnectionState
    );

  };


  return peerConnection;

}


/* =================================
   SEND OFFER
================================= */

async function sendOffer(){

  const pc =
  createPeer();

  console.log(
    "CREATING OFFER"
  );

  const offer =
  await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  socket.emit(
    "offer",
    {
      roomId:roomId,
      offer:pc.localDescription
    }
  );

  setStatus(
    "📡 Offer भेजा गया"
  );

}


/* =================================
   SOCKET CONNECT
================================= */

socket.on(
  "connect",
  () => {

    console.log(
      "SOCKET CONNECTED:",
      socket.id
    );

    setStatus(
      "🟢 Server connected"
    );

  }
);


/* =================================
   ROOM JOINED
================================= */

socket.on(
  "room-joined",
  data => {

    console.log(
      "ROOM JOINED:",
      data
    );

    if(data.users === 1){

      setStatus(
        "📱 दूसरे फोन का इंतजार..."
      );

    }

    if(data.users === 2){

      setStatus(
        "📱 दोनों फोन room में हैं"
      );

    }

  }
);


/* =================================
   PEER JOINED
================================= */

socket.on(
  "peer-joined",
  async() => {

    console.log(
      "PEER JOINED EVENT"
    );

    setStatus(
      "📱 दूसरा फोन मिल गया"
    );

    /*
      सिर्फ Phone A offer बनाएगा
    */

    if(initiator){

      await sendOffer();

    }

  }
);


/* =================================
   PEER READY
================================= */

socket.on(
  "peer-ready",
  async() => {

    console.log(
      "PEER READY EVENT"
    );

    /*
      अगर किसी कारण peer-joined
      miss हो जाए तो initiator
      फिर से offer भेज सकता है
    */

    if(initiator){

      if(!peerConnection){

        await sendOffer();

      }

    }

  }
);


/* =================================
   OFFER RECEIVED
================================= */

socket.on(
  "offer",
  async(offer) => {

    console.log(
      "OFFER RECEIVED"
    );

    const pc =
    createPeer();

    await pc.setRemoteDescription(
      new RTCSessionDescription(offer)
    );

    console.log(
      "REMOTE DESCRIPTION SET"
    );


    /*
      Pending ICE
    */

    for(
      const candidate
      of pendingCandidates
    ){

      try{

        await pc.addIceCandidate(
          new RTCIceCandidate(candidate)
        );

      }

      catch(error){

        console.error(
          "PENDING ICE ERROR:",
          error
        );

      }

    }

    pendingCandidates = [];


    /*
      Answer
    */

    const answer =
    await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    socket.emit(
      "answer",
      {
        roomId:roomId,
        answer:pc.localDescription
      }
    );

    setStatus(
      "📡 Answer भेजा गया"
    );

  }
);


/* =================================
   ANSWER RECEIVED
================================= */

socket.on(
  "answer",
  async(answer) => {

    console.log(
      "ANSWER RECEIVED"
    );

    if(!peerConnection){

      console.log(
        "NO PEER CONNECTION"
      );

      return;

    }

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(answer)
    );

    console.log(
      "ANSWER REMOTE DESCRIPTION SET"
    );


    for(
      const candidate
      of pendingCandidates
    ){

      try{

        await peerConnection.addIceCandidate(
          new RTCIceCandidate(candidate)
        );

      }

      catch(error){

        console.error(
          "ICE ERROR:",
          error
        );

      }

    }

    pendingCandidates = [];

    setStatus(
      "🟢 Answer मिल गया"
    );

  }
);


/* =================================
   ICE RECEIVED
================================= */

socket.on(
  "ice-candidate",
  async(candidate) => {

    console.log(
      "ICE RECEIVED"
    );

    if(
      peerConnection &&
      peerConnection.remoteDescription
    ){

      try{

        await peerConnection.addIceCandidate(
          new RTCIceCandidate(candidate)
        );

      }

      catch(error){

        console.error(
          "ADD ICE ERROR:",
          error
        );

      }

    }

    else{

      pendingCandidates.push(
        candidate
      );

    }

  }
);


/* =================================
   ROOM FULL
================================= */

socket.on(
  "room-full",
  () => {

    alert(
      "यह Room पहले से 2 फोन से connected है।"
    );

    setStatus(
      "❌ Room Full"
    );

  }
);


/* =================================
   CAMERA ON/OFF
================================= */

cameraBtn.onclick =
function(){

  if(!localStream) return;

  const track =
  localStream.getVideoTracks()[0];

  if(!track) return;

  track.enabled =
  !track.enabled;

  cameraBtn.innerText =
  track.enabled
  ? "📷 Camera"
  : "🚫 Camera";

  setStatus(
    track.enabled
    ? "📷 Camera ON"
    : "🚫 Camera OFF"
  );

};


/* =================================
   MIC ON/OFF
================================= */

micBtn.onclick =
function(){

  if(!localStream) return;

  const track =
  localStream.getAudioTracks()[0];

  if(!track) return;

  track.enabled =
  !track.enabled;

  micBtn.innerText =
  track.enabled
  ? "🎤 Mic"
  : "🔇 Mic";

  setStatus(
    track.enabled
    ? "🎤 Mic ON"
    : "🔇 Mic OFF"
  );

};


/* =================================
   SWITCH CAMERA
================================= */

switchBtn.onclick =
async function(){

  if(!localStream){

    return;

  }

  facingMode =
  facingMode === "user"
  ? "environment"
  : "user";

  try{

    const newStream =
    await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:facingMode
      },

      audio:false

    });

    const newTrack =
    newStream.getVideoTracks()[0];


    const sender =
    peerConnection &&
    peerConnection
    .getSenders()
    .find(
      sender =>
      sender.track &&
      sender.track.kind === "video"
    );


    if(sender){

      await sender.replaceTrack(
        newTrack
      );

    }


    const oldTrack =
    localStream.getVideoTracks()[0];

    if(oldTrack){

      oldTrack.stop();

      localStream.removeTrack(
        oldTrack
      );

    }


    localStream.addTrack(
      newTrack
    );

    localVideo.srcObject =
    localStream;

    setStatus(
      "🔄 Camera switched"
    );

  }

  catch(error){

    console.error(error);

    setStatus(
      "❌ Camera switch failed"
    );

  }

};


/* =================================
   SOUND
================================= */

soundBtn.onclick =
async function(){

  remoteVideo.muted = false;

  remoteVideo.volume = 1;

  try{

    await remoteVideo.play();

  }

  catch(error){

    console.log(error);

  }

  setStatus(
    "🔊 Sound ON"
  );

};


/* =================================
   STOP
================================= */

stopBtn.onclick =
function(){

  if(localStream){

    localStream
    .getTracks()
    .forEach(
      track => track.stop()
    );

    localStream = null;

  }

  localVideo.srcObject = null;

  cameraBtn.innerText =
  "📷 Camera";

  micBtn.innerText =
  "🎤 Mic";

  setStatus(
    "⛔ Camera stopped"
  );

};


/* =================================
   START BUTTON
================================= */

startBtn.onclick =
function(){

  createRoom();

};


/* =================================
   QR SCANNER
================================= */

scanBtn.onclick =
async function(){

  if(scanner){

    return;

  }

  scanner =
  new Html5Qrcode(
    "reader"
  );

  try{

    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,
        qrbox:250
      },

      async(decodedText) => {

        console.log(
          "QR FOUND:",
          decodedText
        );

        let url;

        try{

          url =
          new URL(decodedText);

        }

        catch(error){

          alert(
            "Invalid QR"
          );

          return;

        }

        const room =
        url.searchParams.get("room");

        if(!room){

          alert(
            "Room ID नहीं मिला"
          );

          return;

        }

        try{

          await scanner.stop();

          scanner.clear();

        }

        catch(error){

          console.log(error);

        }

        scanner = null;

        await joinRoom(room);

      }

    );

    setStatus(
      "📷 QR Scanner चालू है"
    );

  }

  catch(error){

    console.error(error);

    alert(
      "QR Scanner के लिए Camera Permission Allow करें।"
    );

  }

};


/* =================================
   CLOSE SCANNER
