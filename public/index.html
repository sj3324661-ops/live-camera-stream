<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Camera — Internet Camera Streaming</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#07111f;
  color:white;
  min-height:100vh;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0d1b2d;
  border-bottom:1px solid #243852;
  font-size:20px;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:15px;
}

/* VIDEO AREA */

.video-stage{
  position:relative;
  width:100%;
  height:65vh;
  min-height:380px;
  max-height:650px;
  background:#000;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #29405f;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

#localVideo{
  position:absolute;
  right:12px;
  bottom:12px;
  width:125px;
  height:175px;
  object-fit:cover;
  background:#111;
  border-radius:14px;
  border:2px solid white;
  box-shadow:0 5px 20px rgba(0,0,0,.6);
  z-index:5;
}

.waiting{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  color:#b8c7da;
  font-size:17px;
  background:#050b13;
  z-index:2;
}

.waiting.hidden{
  display:none;
}

/* STATUS */

.status{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  text-align:center;
  background:#101f33;
  color:#bcd0e8;
  font-size:14px;
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:14px;
}

button{
  border:none;
  border-radius:12px;
  padding:13px 10px;
  font-size:15px;
  font-weight:bold;
  color:white;
  background:#1769aa;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

button.stop{
  background:#b83232;
}

button.green{
  background:#16845b;
}

button.gray{
  background:#37475a;
}

/* QR */

.panel{
  margin-top:16px;
  background:#0d1b2d;
  border:1px solid #243852;
  border-radius:18px;
  padding:18px;
  text-align:center;
}

.panel h2{
  font-size:18px;
  margin-bottom:8px;
}

.panel p{
  color:#9eb2c9;
  font-size:14px;
  margin-bottom:14px;
}

#qrcode{
  background:white;
  width:220px;
  height:220px;
  margin:15px auto;
  padding:10px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#qrcode img{
  width:200px;
  height:200px;
}

.room{
  word-break:break-all;
  font-size:12px;
  color:#7fa8d6;
  margin-top:8px;
}

/* SCANNER */

#scannerPanel{
  display:none;
}

#reader{
  width:100%;
  max-width:400px;
  margin:15px auto;
  overflow:hidden;
  border-radius:12px;
}

.hidden{
  display:none !important;
}

/* MOBILE */

@media(max-width:500px){

  header{
    font-size:17px;
  }

  .container{
    padding:10px;
  }

  .video-stage{
    height:62vh;
    min-height:350px;
  }

  #localVideo{
    width:105px;
    height:145px;
    right:9px;
    bottom:9px;
  }

  .controls{
    gap:8px;
  }

  button{
    font-size:14px;
    padding:12px 7px;
  }
}
</style>
</head>

<body>

<header>
📹 Live Camera
</header>

<div class="container">

  <!-- MAIN VIDEO -->
  <div class="video-stage">

    <video
      id="remoteVideo"
      autoplay
      playsinline
    ></video>

    <!-- OWN CAMERA -->
    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div id="waiting" class="waiting">
      📡<br><br>
      दूसरे फोन के कनेक्ट होने का इंतज़ार...
    </div>

  </div>

  <!-- STATUS -->
  <div id="status" class="status">
    🔵 Ready
  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <button
      id="cameraBtn"
      class="green"
      onclick="toggleCamera()">
      📷 Camera ON
    </button>

    <button
      id="micBtn"
      class="green"
      onclick="toggleMic()">
      🎙️ Mic ON
    </button>

    <button
      onclick="switchCamera()">
      🔄 Front / Back
    </button>

    <button
      class="stop"
      onclick="stopCamera()">
      ⛔ Stop Camera
    </button>

  </div>


  <!-- PHONE A QR -->
  <div id="qrPanel" class="panel hidden">

    <h2>📱 Phone B को Connect करें</h2>

    <p>
      इस QR Code को दूसरे फोन से Scan करें
    </p>

    <div id="qrcode"></div>

    <div class="room">
      Room: <span id="roomText"></span>
    </div>

  </div>


  <!-- PHONE B SCANNER -->
  <div id="scannerPanel" class="panel">

    <h2>📲 Phone A का QR Scan करें</h2>

    <p>
      QR Scan करने के बाद दोनों फोन Connect हो जाएंगे
    </p>

    <button
      class="green"
      onclick="startScanner()">
      📷 QR Scan शुरू करें
    </button>

    <div id="reader"></div>

  </div>

</div>


<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- QR SCANNER LIBRARY -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>


<script>

/* =========================================
   SOCKET
========================================= */

const socket = io();


/* =========================================
   ELEMENTS
========================================= */

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const waiting =
  document.getElementById("waiting");

const statusBox =
  document.getElementById("status");

const qrPanel =
  document.getElementById("qrPanel");

const scannerPanel =
  document.getElementById("scannerPanel");

const roomText =
  document.getElementById("roomText");

const cameraBtn =
  document.getElementById("cameraBtn");

const micBtn =
  document.getElementById("micBtn");


/* =========================================
   VARIABLES
========================================= */

let localStream = null;
let peerConnection = null;

let currentRoom = null;

let isInitiator = false;

let cameraFacing = "user";

let pendingCandidates = [];

let cameraEnabled = true;
let micEnabled = true;

let scanner = null;


/* =========================================
   ICE SERVERS
========================================= */

const rtcConfig = {

  iceServers: [

    {
      urls: "stun:stun.l.google.com:19302"
    },

    {
      urls: "stun:stun1.l.google.com:19302"
    }

  ]

};


/* =========================================
   STATUS
========================================= */

function setStatus(text){

  statusBox.innerText = text;

}


/* =========================================
   RANDOM ROOM
========================================= */

function createRoomId(){

  return Math.random()
    .toString(36)
    .substring(2,10);

}


/* =========================================
   START LOCAL CAMERA
========================================= */

async function startLocalCamera(){

  try{

    if(localStream){

      localStream.getTracks().forEach(
        track => track.stop()
      );

    }

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:cameraFacing
        },

        audio:true

      });


    localVideo.srcObject =
      localStream;


    cameraEnabled = true;
    micEnabled = true;

    updateButtons();


    setStatus("📷 आपका कैमरा ON है");


  }

  catch(error){

    console.error(error);

    setStatus(
      "❌ Camera/Microphone permission नहीं मिली"
    );

    alert(
      "Camera और Microphone की permission Allow करें।"
    );

  }

}


/* =========================================
   PHONE A - CREATE ROOM
========================================= */

async function createRoom(){

  isInitiator = true;

  currentRoom = createRoomId();

  await startLocalCamera();


  socket.emit(
    "join-room",
    currentRoom
  );


  showQRCode();


  scannerPanel.classList.add(
    "hidden"
  );


  waiting.classList.remove(
    "hidden"
  );


  setStatus(
    "📱 Phone B का इंतज़ार..."
  );

}


/* =========================================
   SHOW QR
========================================= */

function showQRCode(){

  qrPanel.classList.remove(
    "hidden"
  );

  roomText.innerText =
    currentRoom;


  const joinURL =
    window.location.origin +
    "/?room=" +
    encodeURIComponent(currentRoom);


  document.getElementById(
    "qrcode"
  ).innerHTML = "";


  new QRCode(
    document.getElementById("qrcode"),
    {
      text:joinURL,
      width:200,
      height:200
    }
  );

}


/* =========================================
   PHONE B - JOIN ROOM
========================================= */

async function joinRoom(roomId){

  currentRoom = roomId;

  isInitiator = false;


  await startLocalCamera();


  if(!localStream){

    return;

  }


  scannerPanel.classList.add(
    "hidden"
  );

  qrPanel.classList.add(
    "hidden"
  );


  socket.emit(
    "join-room",
    currentRoom
  );


  waiting.classList.remove(
    "hidden"
  );


  setStatus(
    "🔗 Phone A से Connect हो रहा है..."
  );

}


/* =========================================
   SOCKET ROOM JOINED
========================================= */

socket.on(
  "room-joined",
  data => {

    console.log(
      "Room joined:",
      data
    );

    setStatus(
      "✅ Room connected"
    );

  }
);


/* =========================================
   PEER JOINED
========================================= */

socket.on(
  "peer-joined",
  async () => {

    console.log(
      "Second phone joined"
    );


    if(!isInitiator){

      return;

    }


    setStatus(
      "📡 Phone B connected — Connecting camera..."
    );


    await createPeerConnection();


    await createOffer();

  }
);


/* =========================================
   CREATE PEER CONNECTION
========================================= */

async function createPeerConnection(){

  if(peerConnection){

    try{

      peerConnection.close();

    }

    catch(e){}

  }


  pendingCandidates = [];


  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );


  /* LOCAL TRACKS */

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }


  /* REMOTE TRACK */

  peerConnection.ontrack =
    event => {

      console.log(
        "Remote track received"
      );


      if(
        event.streams &&
        event.streams[0]
      ){

        remoteVideo.srcObject =
          event.streams[0];

      }

      else{

        const stream =
          new MediaStream();

        stream.addTrack(
          event.track
        );

        remoteVideo.srcObject =
          stream;

      }


      waiting.classList.add(
        "hidden"
      );


      setStatus(
        "🟢 दोनों फोन Live Connected"
      );

    };


  /* ICE */

  peerConnection.onicecandidate =
    event => {

      if(
        event.candidate &&
        currentRoom
      ){

        socket.emit(
          "ice-candidate",
          {
            roomId:currentRoom,
            candidate:event.candidate
          }
        );

      }

    };


  /* CONNECTION STATE */

  peerConnection.onconnectionstatechange =
    () => {

      console.log(
        "Connection:",
        peerConnection.connectionState
      );


      if(
        peerConnection.connectionState ===
        "connected"
      ){

        setStatus(
          "🟢 Live Connected"
        );

      }


      if(
        peerConnection.connectionState ===
        "disconnected"
      ){

        setStatus(
          "🟡 Connection disconnected"
        );

      }


      if(
        peerConnection.connectionState ===
        "failed"
      ){

        setStatus(
          "🔴 Connection failed"
        );

      }

    };

}


/* =========================================
   CREATE OFFER
========================================= */

async function createOffer(){

  try{

    const offer =
      await peerConnection.createOffer();


    await peerConnection.setLocalDescription(
      offer
    );


    socket.emit(
      "offer",
      {
        roomId:currentRoom,
        offer:offer
      }
    );


    setStatus(
      "📡 Offer भेजा जा रहा है..."
    );

  }

  catch(error){

    console.error(
      "Offer error:",
      error
    );

  }

}


/* =========================================
   RECEIVE OFFER
========================================= */

socket.on(
  "offer",
  async offer => {

    console.log(
      "Offer received"
    );


    if(!peerConnection){

      await createPeerConnection();

    }


    try{

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(offer)
      );


      /* PENDING ICE */

      for(
        const candidate of pendingCandidates
      ){

        try{

          await peerConnection.addIceCandidate(
            candidate
          );

        }

        catch(e){

          console.log(e);

        }

      }


      pendingCandidates = [];


      const answer =
        await peerConnection.createAnswer();


      await peerConnection.setLocalDescription(
        answer
      );


      socket.emit(
        "answer",
        {
          roomId:currentRoom,
          answer:answer
        }
      );


      setStatus(
        "📡 Answer भेजा जा रहा है..."
      );

    }

    catch(error){

      console.error(
        "Offer handling error:",
        error
      );

    }

  }
);


/* =========================================
   RECEIVE ANSWER
========================================= */

socket.on(
  "answer",
  async answer => {

    console.log(
      "Answer received"
    );


    if(!peerConnection){

      return;

    }


    try{

      await peerConnection.setRemoteDescription(
        new RTCSessionDescription(answer)
      );


      for(
        const candidate of pendingCandidates
      ){

        try{

          await peerConnection.addIceCandidate(
            candidate
          );

        }

        catch(e){

          console.log(e);

        }

      }


      pendingCandidates = [];


      setStatus(
        "🟢 दोनों फोन Connect हो रहे हैं..."
      );

    }

    catch(error){

      console.error(
        "Answer error:",
        error
      );

    }

  }
);


/* =========================================
   ICE CANDIDATE
========================================= */

socket.on(
  "ice-candidate",
  async candidate => {

    if(!candidate){

      return;

    }


    const iceCandidate =
      new RTCIceCandidate(
        candidate
      );


    if(
      peerConnection &&
      peerConnection.remoteDescription
    ){

      try{

        await peerConnection.addIceCandidate(
          iceCandidate
        );

      }

      catch(error){

        console.error(
          "ICE error:",
          error
        );

      }

    }

    else{

      pendingCandidates.push(
        iceCandidate
      );

    }

  }
);


/* =========================================
   CAMERA TOGGLE
========================================= */

function toggleCamera(){

  if(!localStream){

    alert(
      "पहले Camera Start करें।"
    );

    return;

  }


  const videoTracks =
    localStream.getVideoTracks();


  if(videoTracks.length === 0){

    return;

  }


  cameraEnabled =
    !cameraEnabled;


  videoTracks.forEach(
    track => {

      track.enabled =
        cameraEnabled;

    }
  );


  updateButtons();


  sendMediaState();

}


/* =========================================
   MIC TOGGLE
========================================= */

function toggleMic(){

  if(!localStream){

    alert(
      "पहले Camera Start करें।"
    );

    return;

  }


  const audioTracks =
    localStream.getAudioTracks();


  if(audioTracks.length === 0){

    return;

  }


  micEnabled =
    !micEnabled;


  audioTracks.forEach(
    track => {

      track.enabled =
        micEnabled;

    }
  );


  updateButtons();


  sendMediaState();

}


/* =========================================
   UPDATE BUTTONS
========================================= */

function updateButtons(){

  if(cameraEnabled){

    cameraBtn.innerText =
      "📷 Camera ON";

    cameraBtn.className =
      "green";

  }

  else{

    cameraBtn.innerText =
      "🚫 Camera OFF";

    cameraBtn.className =
      "stop";

  }


  if(micEnabled){

    micBtn.innerText =
      "🎙️ Mic ON";

    micBtn.className =
      "green";

  }

  else{

    micBtn.innerText =
      "🔇 Mic OFF";

    micBtn.className =
      "stop";

  }

}


/* =========================================
   SEND MEDIA STATE
========================================= */

function sendMediaState(){

  if(!currentRoom){

    return;

  }


  socket.emit(
    "media-state",
    {
      roomId:currentRoom,

      state:{
        camera:cameraEnabled,
        mic:micEnabled
      }

    }
  );

}


/* =========================================
   RECEIVE MEDIA STATE
========================================= */

socket.on(
  "media-state",
  state => {

    console.log(
      "Remote media state:",
      state
    );

  }
);


/* =========================================
   SWITCH CAMERA
========================================= */

async function switchCamera(){

  if(!localStream){

    alert(
      "पहले Camera Start करें।"
    );

    return;

  }


  cameraFacing =
    cameraFacing === "user"
      ? "environment"
      : "user";


  try{

    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:cameraFacing
        },

        audio:false

      });


    const newVideoTrack =
      newStream.getVideoTracks()[0];


    const sender =
      peerConnection
      ? peerConnection
          .getSenders()
          .find(
            s =>
              s.track &&
              s.track.kind === "video"
          )
      : null;


    if(sender){

      await sender.replaceTrack(
        newVideoTrack
      );

    }


    const oldVideoTrack =
      localStream.getVideoTracks()[0];


    if(oldVideoTrack){

      oldVideoTrack.stop();

    }


    localStream.removeTrack(
      oldVideoTrack
    );


    localStream.addTrack(
      newVideoTrack
    );


    localVideo.srcObject =
      localStream;


    newVideoTrack.enabled =
      cameraEnabled;


    setStatus(
      cameraFacing === "user"
        ? "🤳 Front Camera"
        : "📷 Back Camera"
    );

  }

  catch(error){

    console.error(error);

    alert(
      "Camera switch नहीं हो पाया।"
    );

  }

}


/* =========================================
   STOP CAMERA
========================================= */

function stopCamera(){

  if(!localStream){

    return;

  }


  localStream
    .getTracks()
    .forEach(
      track => track.stop()
    );


  localStream = null;


  localVideo.srcObject =
    null;


  cameraEnabled = false;
  micEnabled = false;


  updateButtons();


  setStatus(
    "⛔ आपका Camera बंद है"
  );


  sendMediaState();

}


/* =========================================
   QR SCANNER
========================================= */

async function startScanner(){

  scannerPanel.classList.remove(
    "hidden"
  );


  if(scanner){

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  try{

    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        }

      },

      async decodedText => {

        console.log(
          "QR:",
          decodedText
        );


        try{

          await scanner.stop();

        }

        catch(e){}


        scanner.clear();

        scanner = null;


        let roomId = null;


        try{

          const url =
            new URL(decodedText);


          roomId =
            url.searchParams.get(
              "room"
            );

        }

        catch(e){

          roomId =
            decodedText;
