<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Live Camera</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
}

/* =========================
   HEADER
========================= */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.35);
  backdrop-filter:blur(6px);

  font-size:18px;
  font-weight:bold;

  z-index:30;

  pointer-events:none;
}

/* =========================
   CONTAINER
========================= */

.container{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

/* =========================
   FULL SCREEN CAMERA
========================= */

.stage{
  position:fixed;
  inset:0;

  width:100vw;
  height:100vh;

  background:#000;

  border:0;
  border-radius:0;

  overflow:hidden;

  z-index:1;
}

#remoteVideo{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  background:#000;
}

/* =========================
   OWN CAMERA - SMALL
========================= */

#localVideo{
  position:absolute;

  right:12px;
  bottom:92px;

  width:95px;
  height:125px;

  object-fit:cover;

  background:#111;

  border:2px solid white;
  border-radius:11px;

  z-index:15;

  box-shadow:0 4px 15px rgba(0,0,0,.6);
}

/* =========================
   WAITING
========================= */

.waiting{
  position:absolute;

  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:rgba(0,0,0,.45);

  z-index:5;

  pointer-events:none;
}

.waiting h2{
  margin:0 0 8px;
  font-size:22px;
}

.waiting p{
  margin:0;
  font-size:14px;
  opacity:.85;
}

/* =========================
   STATUS
========================= */

.status{
  position:fixed;

  top:55px;
  left:50%;

  transform:translateX(-50%);

  width:max-content;
  max-width:90%;

  padding:7px 12px;

  border-radius:20px;

  background:rgba(0,0,0,.55);

  font-size:12px;

  text-align:center;

  z-index:35;

  backdrop-filter:blur(5px);
}

/* =========================
   START BUTTON
========================= */

#startBtn{
  position:fixed;

  left:50%;
  bottom:35px;

  transform:translateX(-50%);

  width:auto;
  min-width:190px;

  padding:12px 18px;

  border:0;
  border-radius:12px;

  background:#159447;

  color:white;

  font-size:14px;
  font-weight:bold;

  z-index:50;
}

/* =========================
   CONTROL BUTTONS
========================= */

.controls{
  position:fixed;

  left:50%;
  bottom:10px;

  transform:translateX(-50%);

  width:100%;

  display:flex;

  justify-content:center;
  align-items:center;

  flex-wrap:wrap;

  gap:4px;

  padding:4px;

  z-index:40;

  background:transparent;
}

.controls button{
  width:auto;
  min-width:68px;

  padding:7px 8px;

  margin:0;

  border:0;

  border-radius:8px;

  color:white;

  font-size:11px;
  font-weight:bold;

  box-shadow:0 3px 10px rgba(0,0,0,.4);
}

/* =========================
   GENERAL BUTTON
========================= */

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.96);
}

.green{
  background:#159447;
}

.red{
  background:#d93636;
}

.orange{
  background:#d97818;
}

.gray{
  background:#34495e;
}

/* =========================
   SOUND BUTTON
========================= */

#soundBtn{
  position:fixed;

  right:12px;
  top:58px;

  width:auto;

  padding:8px 11px;

  border:0;
  border-radius:20px;

  background:rgba(217,120,24,.9);

  color:white;

  font-size:12px;
  font-weight:bold;

  z-index:45;
}

/* =========================
   QR PANEL
========================= */

#qrPanel{
  position:fixed;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:90%;
  max-width:350px;

  padding:18px;

  background:#0d1b2e;

  border:1px solid #36506e;

  border-radius:18px;

  z-index:100;

  text-align:center;
}

#qrPanel h3{
  margin-top:0;
}

#qrcode{
  display:flex;

  justify-content:center;

  background:white;

  padding:10px;

  width:max-content;

  margin:15px auto;

  border-radius:10px;
}

.room{
  font-size:12px;
  color:#9fc7ff;

  word-break:break-all;
}

/* =========================
   SCANNER PANEL
========================= */

#scannerPanel{
  position:fixed;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:90%;
  max-width:400px;

  padding:18px;

  background:#0d1b2e;

  border:1px solid #36506e;

  border-radius:18px;

  z-index:100;

  text-align:center;
}

#scannerPanel h3{
  margin-top:0;
}

#scanBtn{
  width:100%;

  padding:12px;

  border:0;

  border-radius:10px;

  background:#1769e0;

  color:white;

  font-size:14px;

  font-weight:bold;
}

#reader{
  width:100%;
  margin-top:12px;
}

/* =========================
   HIDDEN
========================= */

.hidden{
  display:none!important;
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

  #localVideo{
    width:82px;
    height:110px;
    bottom:88px;
    right:8px;
  }

  .controls button{
    min-width:62px;
    padding:6px 7px;
    font-size:10px;
  }

  .status{
    font-size:11px;
  }

}

/* =========================
   LANDSCAPE
========================= */

@media(orientation:landscape){

  #localVideo{
    width:110px;
    height:82px;

    bottom:70px;
    right:12px;
  }

  .controls{
    bottom:8px;
  }

}
</style>
</head>

<body>

<header>
  📹 Live Camera
</header>

<div class="container">

  <!-- =========================
       CAMERA SCREEN
  ========================== -->

  <div class="stage">

    <!-- OTHER PHONE CAMERA -->
    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

    <!-- YOUR CAMERA -->
    <video
      id="localVideo"
      autoplay
      muted
      playsinline>
    </video>

    <!-- WAITING -->
    <div id="waiting" class="waiting">

      <div>
        <h2>📡 Waiting...</h2>

        <p>
          दूसरे फोन के connect होने का इंतजार करें
        </p>
      </div>

    </div>

  </div>


  <!-- =========================
       START
  ========================== -->

  <button
    id="startBtn"
    class="green">

    🚀 Camera Start + QR

  </button>


  <!-- =========================
       SOUND
  ========================== -->

  <button
    id="soundBtn"
    class="orange hidden">

    🔊 Sound ON

  </button>


  <!-- =========================
       STATUS
  ========================== -->

  <div id="status" class="status">
    Connecting...
  </div>


  <!-- =========================
       CONTROLS
  ========================== -->

  <div
    id="controls"
    class="controls hidden">

    <button
      id="cameraBtn"
      class="green">

      📷 Camera

    </button>

    <button
      id="micBtn"
      class="green">

      🎤 Mic

    </button>

    <button
      id="switchBtn"
      class="orange">

      🔄 Switch

    </button>

    <button
      id="stopBtn"
      class="red">

      ⛔ Stop

    </button>

  </div>


  <!-- =========================
       QR
  ========================== -->

  <div
    id="qrPanel"
    class="hidden">

    <h3>
      📱 Phone B को QR Scan कराएं
    </h3>

    <div id="qrcode"></div>

    <div
      id="roomText"
      class="room">
    </div>

  </div>


  <!-- =========================
       QR SCANNER
  ========================== -->

  <div
    id="scannerPanel">

    <h3>
      📷 QR Scan करें
    </h3>

    <button id="scanBtn">
      📷 QR Scanner Start
    </button>

    <div id="reader"></div>

  </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let socket = io();

let localStream = null;

let remoteStream =
  new MediaStream();

let peerConnection = null;

let roomId = null;

let initiator = false;

let pendingCandidates = [];

let currentFacingMode = "user";

let scanner = null;


/* =========================
   ELEMENTS
========================= */

const startBtn =
  document.getElementById("startBtn");

const soundBtn =
  document.getElementById("soundBtn");

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const waiting =
  document.getElementById("waiting");

const statusBox =
  document.getElementById("status");

const controls =
  document.getElementById("controls");

const qrPanel =
  document.getElementById("qrPanel");

const scannerPanel =
  document.getElementById("scannerPanel");

const cameraBtn =
  document.getElementById("cameraBtn");

const micBtn =
  document.getElementById("micBtn");

const switchBtn =
  document.getElementById("switchBtn");

const stopBtn =
  document.getElementById("stopBtn");

const scanBtn =
  document.getElementById("scanBtn");

const qrcodeBox =
  document.getElementById("qrcode");

const roomText =
  document.getElementById("roomText");


/* =========================
   STATUS
========================= */

function status(text){

  statusBox.innerText = text;

  console.log(text);

}


/* =========================
   START CAMERA
========================= */

async function startCamera(){

  try{

    if(localStream){

      localStream
        .getTracks()
        .forEach(track => track.stop());

    }


    localStream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:currentFacingMode,

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }
        },

        audio:true

      });


    localVideo.srcObject =
      localStream;


    controls.classList
      .remove("hidden");


    status(
      "📷 Camera started"
    );


    return true;


  }catch(error){

    console.error(error);

    status(
      "❌ Camera/Mic permission denied"
    );

    alert(
      "Camera और Microphone की permission Allow करें।"
    );

    return false;

  }

}


/* =========================
   CREATE ROOM
========================= */

async function createRoom(){

  initiator = true;


  roomId =
    Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();


  const ok =
    await startCamera();


  if(!ok){

    return;

  }


  socket.emit(
    "join-room",
    roomId
  );


  showQR();


  startBtn.classList
    .add("hidden");


  scannerPanel.classList
    .add("hidden");


  status(
    "📱 QR तैयार है — Phone B scan करे"
  );

}


/* =========================
   SHOW QR
========================= */

function showQR(){

  qrPanel.classList
    .remove("hidden");


  qrcodeBox.innerHTML =
    "";


  const url =
    window.location.origin +
    "/?room=" +
    encodeURIComponent(roomId);


  new QRCode(
    qrcodeBox,
    {
      text:url,
      width:220,
      height:220
    }
  );


  roomText.innerText =
    "Room: " + roomId;

}


/* =========================
   JOIN ROOM
========================= */

async function joinRoom(id){

  roomId = id;

  initiator = false;


  const ok =
    await startCamera();


  if(!ok){

    return;

  }


  startBtn.classList
    .add("hidden");


  qrPanel.classList
    .add("hidden");


  scannerPanel.classList
    .add("hidden");


  socket.emit(
    "join-room",
    roomId
  );


  status(
    "🔗 Room join हो रहा है..."
  );

}


/* =========================
   CREATE PEER
========================= */

function createPeer(){

  if(peerConnection){

    return peerConnection;

  }


  peerConnection =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
          "stun:stun.l.google.com:19302"
        },

        {
          urls:
          "stun:stun1.l.google.com:19302"
        },

        {
          urls:
          "stun:stun2.l.google.com:19302"
        }

      ]

    });


  /* =========================
     ADD LOCAL TRACKS
  ========================== */

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }


  /* =========================
     REMOTE TRACK
  ========================== */

  peerConnection.ontrack =
    async event => {

      console.log(
        "REMOTE TRACK:",
        event.track.kind
      );


      if(
        !remoteStream
      ){

        remoteStream =
          new MediaStream();

      }


      const alreadyAdded =
        remoteStream
        .getTracks()
        .some(
          track =>
          track.id ===
          event.track.id
        );


      if(!alreadyAdded){

        remoteStream.addTrack(
          event.track
        );

      }


      remoteVideo.srcObject =
        remoteStream;


      waiting.classList
        .add("hidden");


      soundBtn.classList
        .remove("hidden");


      status(
        "🟢 दूसरे फोन का LIVE CAMERA CONNECTED"
      );


      try{

        await remoteVideo.play();

      }catch(error){

        console.log(
          "Autoplay blocked:",
          error
        );

      }

    };


  /* =========================
     ICE
  ========================== */

  peerConnection.onicecandidate =
    event => {

      if(event.candidate){

        socket.emit(
          "ice-candidate",
          {

            roomId:roomId,

            candidate:
              event.candidate

          }
        );

      }

    };


  /* =========================
     CONNECTION STATE
  ========================== */

  peerConnection
    .onconnectionstatechange =
    () => {

      const state =
        peerConnection
        .connectionState;


      console.log(
        "Connection:",
        state
      );


      if(
        state ===
        "connected"
      ){

        status(
          "🟢 दोनों फोन CONNECTED"
        );


        waiting.classList
          .add("hidden");

      }


      if(
        state ===
        "connecting"
      ){

        status(
          "🟡 Video connection हो रहा है..."
        );

      }


      if(
        state ===
        "disconnected"
      ){

        status(
          "🟠 Connection disconnected"
        );

      }


      if(
        state ===
        "failed"
      ){

        status(
          "❌ WebRTC connection failed"
        );

      }

    };


  return peerConnection;

}


/* =========================
   SEND OFFER
========================= */

async function sendOffer(){

  const pc =
    createPeer();


  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  socket.emit(
    "offer",
    {

      roomId:roomId,

      offer:
        pc.localDescription

    }
  );


  status(
    "📡 Phone B को connection offer भेजा गया"
  );

}


/* =========================
   SOCKET CONNECT
========================= */

socket.on(
  "connect",
  () => {

    console.log(
      "Socket connected:",
      socket.id
    );


    status(
      "🟢 Server connected"
    );

  }
);


/* =========================
   PEER JOINED
========================= */

socket.on(
  "peer-joined",
  async() => {

    console.log(
      "Peer joined"
    );


    status(
      "📱 दूसरा फोन मिल गया..."
    );


    if(initiator){

      await sendOffer();

    }

  }
);


/* =========================
   OFFER
========================= */

socket.on(
  "offer",
  async offer => {

    console.log(
      "OFFER RECEIVED"
    );


    const pc =
      createPeer();


    await pc.setRemoteDescription(

      new RTCSessionDescription(
        offer
      )

    );


    /* Pending ICE */

    for(
      const candidate
      of pendingCandidates
    ){

      try{

        await pc.addIceCandidate(

          new RTCIceCandidate(
            candidate
          )

        );

      }catch(error){

        console.log(
          "ICE error:",
          error
        );

      }

    }


    pendingCandidates = [];


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    socket.emit(
      "answer",
      {

        roomId:roomId,

        answer:
          pc.localDescription

      }
    );


    status(
      "📡 Phone A को answer भेजा गया"
    );

  }
);


/* =========================
   ANSWER
========================= */

socket.on(
  "answer",
  async answer => {

    console.log(
      "ANSWER RECEIVED"
    );


    if(!peerConnection){

      return;

    }


    await peerConnection
      .setRemoteDescription(

        new RTCSessionDescription(
          answer
        )

      );


    for(
      const candidate
      of pendingCandidates
    ){

      try{

        await peerConnection
          .addIceCandidate(

            new RTCIceCandidate(
              candidate
            )

          );

      }catch(error){

        console.log(
          "ICE error:",
          error
        );

      }

    }


    pendingCandidates = [];


    status(
      "🟢 Answer मिल गया — connecting..."
    );

  }
);


/* =========================
   ICE CANDIDATE
========================= */

socket.on(
  "ice-candidate",
  async candidate => {

    console.log(
      "ICE RECEIVED"
    );


    if(
      peerConnection &&
      peerConnection.remoteDescription
    ){

      try{

        await peerConnection
          .addIceCandidate(

            new RTCIceCandidate(
              candidate
            )

          );

      }catch(error){

        console.log(
          "ICE add error:",
          error
        );

      }

    }else{

      pendingCandidates.push(
        candidate
      );

    }

  }
);


/* =========================
   ROOM FULL
========================= */

socket.on(
  "room-full",
  () => {

    alert(
      "यह room पहले से 2 फोन से Connected है।"
    );


    status(
      "❌ Room full"
    );

  }
);


/* =========================
   ROOM JOINED
========================= */

socket.on(
  "room-joined",
  data => {

    console.log(
      "Room joined:",
      data
    );


    status(
      "✅ Room joined: " +
      data.roomId
    );

  }
);


/* =========================
   CAMERA ON/OFF
========================= */

cameraBtn.onclick = () => {

  if(!localStream){

    return;

  }


  const track =
    localStream
    .getVideoTracks()[0];


  if(!track){

    return;

  }


  track.enabled =
    !track.enabled;


  cameraBtn.innerText =
    track.enabled
    ? "📷 Camera"
    : "🚫 Camera";

};


/* =========================
   MIC ON/OFF
========================= */

micBtn.onclick = () => {

  if(!localStream){

    return;

  }


  const track =
    localStream
    .getAudioTracks()[0];


  if(!track){

    return;

  }


  track.enabled =
    !track.enabled;


  micBtn.innerText =
    track.enabled
    ? "🎤 Mic"
    : "🔇 Mic";

};


/* =========================
   SWITCH CAMERA
========================= */

switchBtn.onclick =
async() => {

  if(!localStream){

    return;

  }


  currentFacingMode =
    currentFacingMode === "user"
    ? "environment"
    : "user";


  try{

    const newStream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:
            currentFacingMode
        },

        audio:false

      });


    const newVideoTrack =
      newStream
      .getVideoTracks()[0];


    const sender =
      peerConnection
      ?.getSenders()
      .find(
        s =>
        s.track &&
        s.track.kind ===
        "video"
      );


    if(sender){

      await sender
        .replaceTrack(
          newVideoTrack
        );

    }


    const oldTrack =
      localStream
      .getVideoTracks()[0];


    if(oldTrack){
