<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Camera</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
}

header{
  padding:16px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  background:#0d1b2e;
  border-bottom:1px solid #233955;
}

.container{
  max-width:600px;
  margin:auto;
  padding:12px;
}

.stage{
  position:relative;
  width:100%;
  aspect-ratio:16/10;
  background:#000;
  border-radius:18px;
  overflow:hidden;
  border:2px solid #243c5c;
}

#remoteVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

#localVideo{
  position:absolute;
  right:12px;
  bottom:12px;
  width:30%;
  max-width:170px;
  aspect-ratio:4/3;
  object-fit:cover;
  background:#111;
  border:2px solid white;
  border-radius:12px;
  z-index:5;
}

.waiting{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  background:rgba(0,0,0,.6);
  z-index:3;
}

.hidden{
  display:none!important;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  font-size:16px;
  font-weight:bold;
  color:white;
  background:#1769e0;
}

button:active{
  transform:scale(.98);
}

.green{
  background:#159447;
}

.red{
  background:#d93636;
}

.orange{
  background:#d97818;
}

.gray{
  background:#34495e;
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#101f34;
  text-align:center;
  font-size:14px;
}

.panel{
  margin-top:14px;
  padding:15px;
  background:#0d1b2e;
  border:1px solid #243c5c;
  border-radius:16px;
}

.panel h3{
  margin-top:0;
  text-align:center;
}

#qrcode{
  display:flex;
  justify-content:center;
  background:white;
  padding:10px;
  width:max-content;
  margin:15px auto;
  border-radius:10px;
}

#reader{
  width:100%;
  margin-top:10px;
}

.room{
  text-align:center;
  word-break:break-all;
  font-size:13px;
  color:#9fc7ff;
}
</style>
</head>

<body>

<header>📹 Live Camera</header>

<div class="container">

  <div class="stage">

    <video
      id="remoteVideo"
      autoplay
      playsinline
      controls="false">
    </video>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline>
    </video>

    <div id="waiting" class="waiting">
      <div>
        <h2>📡 Waiting...</h2>
        <p>दूसरे फोन के connect होने का इंतजार करें</p>
      </div>
    </div>

  </div>

  <button id="startBtn" class="green">
    🚀 Camera Start + QR बनाएं
  </button>

  <button id="soundBtn" class="orange hidden">
    🔊 Sound ON
  </button>

  <div id="status" class="status">
    Connecting...
  </div>

  <div id="controls" class="panel hidden">

    <button id="cameraBtn" class="green">
      📷 Camera ON
    </button>

    <button id="micBtn" class="green">
      🎤 Mic ON
    </button>

    <button id="switchBtn" class="orange">
      🔄 Front / Back Camera
    </button>

    <button id="stopBtn" class="red">
      ⛔ Stop Camera
    </button>

  </div>

  <div id="qrPanel" class="panel hidden">

    <h3>📱 Phone B को यह QR Scan कराएं</h3>

    <div id="qrcode"></div>

    <div id="roomText" class="room"></div>

  </div>

  <div id="scannerPanel" class="panel">

    <h3>📷 QR Scan करें</h3>

    <button id="scanBtn">
      📷 QR Scanner Start
    </button>

    <div id="reader"></div>

  </div>

</div>


<script>

let socket = io();

let localStream = null;
let remoteStream = new MediaStream();

let peerConnection = null;

let roomId = null;
let initiator = false;

let currentFacingMode = "user";

let pendingCandidates = [];

const startBtn = document.getElementById("startBtn");
const soundBtn = document.getElementById("soundBtn");

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

const waiting = document.getElementById("waiting");

const statusBox = document.getElementById("status");

const controls = document.getElementById("controls");

const qrPanel = document.getElementById("qrPanel");
const scannerPanel = document.getElementById("scannerPanel");

const cameraBtn = document.getElementById("cameraBtn");
const micBtn = document.getElementById("micBtn");
const switchBtn = document.getElementById("switchBtn");
const stopBtn = document.getElementById("stopBtn");

const scanBtn = document.getElementById("scanBtn");

const qrcodeBox = document.getElementById("qrcode");
const roomText = document.getElementById("roomText");


function status(text){

  statusBox.innerText = text;

  console.log(text);

}


/* =========================
   CAMERA
========================= */

async function startCamera(){

  try{

    if(localStream){

      localStream.getTracks().forEach(track => track.stop());

    }

    localStream = await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:currentFacingMode,
        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:true

    });

    localVideo.srcObject = localStream;

    controls.classList.remove("hidden");

    status("📷 Camera started");

    return true;

  }catch(error){

    console.error(error);

    status("❌ Camera/Mic permission denied");

    alert("Camera और Microphone की permission Allow करें।");

    return false;

  }

}


/* =========================
   CREATE ROOM
========================= */

async function createRoom(){

  initiator = true;

  roomId =
    Math.random().toString(36).substring(2,8).toUpperCase();

  const ok = await startCamera();

  if(!ok) return;

  socket.emit("join-room", roomId);

  showQR();

  startBtn.classList.add("hidden");

  scannerPanel.classList.add("hidden");

  status("📱 QR तैयार है — Phone B scan करे");

}


/* =========================
   SHOW QR
========================= */

function showQR(){

  qrPanel.classList.remove("hidden");

  qrcodeBox.innerHTML = "";

  const url =
    window.location.origin +
    "/?room=" +
    encodeURIComponent(roomId);

  new QRCode(qrcodeBox,{

    text:url,

    width:220,

    height:220

  });

  roomText.innerText =
    "Room: " + roomId;

}


/* =========================
   JOIN ROOM
========================= */

async function joinRoom(id){

  roomId = id;

  initiator = false;

  const ok = await startCamera();

  if(!ok) return;

  startBtn.classList.add("hidden");

  qrPanel.classList.add("hidden");

  scannerPanel.classList.add("hidden");

  socket.emit("join-room", roomId);

  status("🔗 Room join हो रहा है...");

}


/* =========================
   CREATE PEER
========================= */

function createPeer(){

  if(peerConnection){

    return peerConnection;

  }

  peerConnection = new RTCPeerConnection({

    iceServers:[

      {
        urls:"stun:stun.l.google.com:19302"
      },

      {
        urls:"stun:stun1.l.google.com:19302"
      },

      {
        urls:"stun:stun2.l.google.com:19302"
      }

    ]

  });


  /* LOCAL TRACKS */

  if(localStream){

    localStream.getTracks().forEach(track => {

      peerConnection.addTrack(
        track,
        localStream
      );

    });

  }


  /* REMOTE TRACKS */

  peerConnection.ontrack = async event => {

    console.log(
      "REMOTE TRACK:",
      event.track.kind
    );

    if(!remoteStream.getTracks().some(
      t => t.id === event.track.id
    )){

      remoteStream.addTrack(event.track);

    }

    remoteVideo.srcObject = remoteStream;

    waiting.classList.add("hidden");

    soundBtn.classList.remove("hidden");

    status("🟢 दूसरे फोन का LIVE CAMERA CONNECTED");

    try{

      await remoteVideo.play();

    }catch(error){

      console.log(
        "Autoplay blocked:",
        error
      );

    }

  };


  /* ICE */

  peerConnection.onicecandidate = event => {

    if(event.candidate){

      socket.emit("ice-candidate",{

        roomId:roomId,

        candidate:event.candidate

      });

    }

  };


  /* CONNECTION */

  peerConnection.onconnectionstatechange = () => {

    console.log(
      "Connection:",
      peerConnection.connectionState
    );

    if(
      peerConnection.connectionState ===
      "connected"
    ){

      status(
        "🟢 दोनों फोन CONNECTED"
      );

      waiting.classList.add("hidden");

    }


    if(
      peerConnection.connectionState ===
      "connecting"
    ){

      status(
        "🟡 Video connection हो रहा है..."
      );

    }


    if(
      peerConnection.connectionState ===
      "disconnected"
    ){

      status(
        "🟠 Connection disconnected"
      );

    }


    if(
      peerConnection.connectionState ===
      "failed"
    ){

      status(
        "❌ WebRTC connection failed"
      );

    }

  };


  return peerConnection;

}


/* =========================
   SEND OFFER
========================= */

async function sendOffer(){

  const pc = createPeer();

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(offer);

  socket.emit("offer",{

    roomId:roomId,

    offer:pc.localDescription

  });

  status(
    "📡 Phone B को connection offer भेजा गया"
  );

}


/* =========================
   SOCKET CONNECT
========================= */

socket.on("connect",()=>{

  console.log(
    "Socket connected:",
    socket.id
  );

  status("🟢 Server connected");

});


/* =========================
   PEER JOINED
========================= */

socket.on("peer-joined",async()=>{

  console.log(
    "Peer joined"
  );

  status(
    "📱 दूसरा फोन मिल गया..."
  );

  if(initiator){

    await sendOffer();

  }

});


/* =========================
   OFFER
========================= */

socket.on("offer",async offer => {

  console.log(
    "OFFER RECEIVED"
  );

  const pc = createPeer();

  await pc.setRemoteDescription(
    new RTCSessionDescription(offer)
  );


  /* Pending ICE */

  for(
    const candidate of pendingCandidates
  ){

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(candidate)
      );

    }catch(error){

      console.log(
        "ICE error:",
        error
      );

    }

  }

  pendingCandidates = [];


  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(answer);


  socket.emit("answer",{

    roomId:roomId,

    answer:pc.localDescription

  });

  status(
    "📡 Phone A को answer भेजा गया"
  );

});


/* =========================
   ANSWER
========================= */

socket.on("answer",async answer => {

  console.log(
    "ANSWER RECEIVED"
  );

  if(!peerConnection){

    return;

  }

  await peerConnection.setRemoteDescription(

    new RTCSessionDescription(answer)

  );


  for(
    const candidate of pendingCandidates
  ){

    try{

      await peerConnection.addIceCandidate(

        new RTCIceCandidate(candidate)

      );

    }catch(error){

      console.log(
        error
      );

    }

  }

  pendingCandidates = [];

  status(
    "🟢 Answer मिल गया — connecting..."
  );

});


/* =========================
   ICE CANDIDATE
========================= */

socket.on(
  "ice-candidate",
  async candidate => {

    console.log(
      "ICE RECEIVED"
    );

    if(
      peerConnection &&
      peerConnection.remoteDescription
    ){

      try{

        await peerConnection.addIceCandidate(

          new RTCIceCandidate(candidate)

        );

      }catch(error){

        console.log(
          "ICE add error:",
          error
        );

      }

    }else{

      pendingCandidates.push(candidate);

    }

  }
);


/* =========================
   ROOM FULL
========================= */

socket.on("room-full",()=>{

  alert(
    "यह room पहले से 2 फोन से Connected है।"
  );

  status(
    "❌ Room full"
  );

});


/* =========================
   ROOM JOINED
========================= */

socket.on("room-joined",data=>{

  console.log(
    "Room joined:",
    data
  );

  status(
    "✅ Room joined: " +
    data.roomId
  );

});


/* =========================
   CAMERA BUTTON
========================= */

cameraBtn.onclick = () => {

  if(!localStream) return;

  const videoTrack =
    localStream.getVideoTracks()[0];

  if(!videoTrack) return;

  videoTrack.enabled =
    !videoTrack.enabled;

  cameraBtn.innerText =
    videoTrack.enabled
    ? "📷 Camera ON"
    : "🚫 Camera OFF";

};


/* =========================
   MIC BUTTON
========================= */

micBtn.onclick = () => {

  if(!localStream) return;

  const audioTrack =
    localStream.getAudioTracks()[0];

  if(!audioTrack) return;

  audioTrack.enabled =
    !audioTrack.enabled;

  micBtn.innerText =
    audioTrack.enabled
    ? "🎤 Mic ON"
    : "🔇 Mic OFF";

};


/* =========================
   SWITCH CAMERA
========================= */

switchBtn.onclick = async()=>{

  if(!localStream) return;

  currentFacingMode =
    currentFacingMode === "user"
    ? "environment"
    : "user";


  try{

    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:currentFacingMode
        },

        audio:false

      });


    const newVideoTrack =
      newStream.getVideoTracks()[0];

    const sender =
      peerConnection
      ?.getSenders()
      .find(
        s =>
          s.track &&
          s.track.kind === "video"
      );


    if(sender){

      await sender.replaceTrack(
        newVideoTrack
      );

    }


    const oldVideoTrack =
      localStream.getVideoTracks()[0];

    if(oldVideoTrack){

      oldVideoTrack.stop();

      localStream.removeTrack(
        oldVideoTrack
      );

    }


    localStream.addTrack(
      newVideoTrack
    );

    localVideo.srcObject =
      localStream;


    status(
      "🔄 Camera switched"
    );

  }catch(error){

    console.error(error);

    status(
      "❌ Camera switch failed"
    );

  }

};


/* =========================
   SOUND
========================= */

soundBtn.onclick = async()=>{

  try{

    remoteVideo.muted = false;

    remoteVideo.volume = 1;

    await remoteVideo.play();

    soundBtn.innerText =
      "🔊 Sound ON";

    status(
      "🔊 Remote sound ON"
    );

  }catch(error){

    console.log(error);

  }

};


/* =========================
   STOP CAMERA
========================= */

stopBtn.onclick = ()=>{

  if(localStream){

    localStream
      .getTracks()
      .forEach(track => track.stop());

    localStream = null;

  }

  localVideo.srcObject = null;

  cameraBtn.innerText =
    "📷 Camera ON";

  micBtn.innerText =
    "🎤 Mic ON";

  status(
    "⛔ Camera stopped"
  );

};


/* =========================
   START BUTTON
========================= */

startBtn.onclick =
  createRoom;


/* =========================
   QR SCANNER
========================= */

let scanner = null;

scanBtn.onclick = async()=>{

  if(scanner){

    return;

  }

  scanner =
    new Html5Qrcode("reader");

  try{

    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,

        qrbox:250

      },

      async decodedText => {

        console.log(
          "QR:",
          decodedText
        );

        let url;

        try{

          url =
            new URL(decodedText);

        }catch{

          alert(
            "Invalid QR"
          );

          return;

        }


        const room =
          url.searchParams.get("room");


        if(!room){

          alert(
            "Room ID नहीं मिला"
          );

          return;

        }


        await scanner.stop();

        scanner.clear();

        scanner = null;

        await joinRoom(room);

      }

    );

  }catch(error){

    console.error(error);

    alert(
      "QR Scanner camera start नहीं हो सका।"
    );

  }

};


/* =========================
   AUTO JOIN
========================= */

window.addEventListener(
  "load",
  async()=>{

    const params =
      new URLSearchParams(
        window.location.search
      );

    const room =
      params.get("room");

    if(room){

      await joinRoom(room);

    }

  }
);

</script>

</body>
                      </html>
